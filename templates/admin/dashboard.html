<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AQI Operacoes - Dashboard</title>
  <link rel="stylesheet" href="/static/admin.css">
</head>
<body class="admin-body">
  <div id="layout"></div>
  <main class="admin-main">
    <header class="admin-header">
      <h1>Dashboard Operacional</h1>
      <span class="admin-sub">Visao geral em tempo real</span>
    </header>

    <section class="admin-cards" id="cards">
      <div class="adm-card">
        <div class="adm-card-lbl">Camioes Esperados</div>
        <div class="adm-card-val" id="c-expected">—</div>
      </div>
      <div class="adm-card adm-card-amber">
        <div class="adm-card-lbl">Em Recepcao</div>
        <div class="adm-card-val" id="c-arrived">—</div>
      </div>
      <div class="adm-card adm-card-green">
        <div class="adm-card-lbl">Descarregados</div>
        <div class="adm-card-val" id="c-unloaded">—</div>
      </div>
      <div class="adm-card adm-card-blue">
        <div class="adm-card-lbl">Saidas em Transito</div>
        <div class="adm-card-val" id="c-departures">—</div>
      </div>
      <div class="adm-card adm-card-blue">
        <div class="adm-card-lbl">Entregues Hoje</div>
        <div class="adm-card-val" id="c-delivered-today">—</div>
      </div>
      <div class="adm-card">
        <div class="adm-card-lbl">Requisicoes Pendentes</div>
        <div class="adm-card-val" id="c-req-pending">—</div>
      </div>
    </section>

    <section class="admin-section" id="alerts-section" style="display:none">
      <h2>Alertas</h2>
      <div id="alerts-body"></div>
    </section>

    <section class="admin-section">
      <h2>Stock Virtual por Produto</h2>
      <div class="tbl-wrap">
        <table class="adm-table" id="stock-table">
          <thead><tr><th>Produto</th><th>Unidade</th><th style="text-align:right">Quantidade</th></tr></thead>
          <tbody id="stock-body"></tbody>
        </table>
      </div>
    </section>

    <section class="admin-section">
      <h2>Movimentos Recentes</h2>
      <div class="tbl-wrap">
        <table class="adm-table" id="mov-table">
          <thead><tr><th>Data</th><th>Tipo</th><th>Produto</th><th>Qtd</th><th>Camiao</th><th>Por</th></tr></thead>
          <tbody id="mov-body"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="/static/admin.js"></script>
  <script>
    AdminUI.renderLayout("dashboard");
    AdminUI.fetchJSON("/admin/api/dashboard").then((d) => {
      document.getElementById("c-expected").textContent = d.trucks.expected;
      document.getElementById("c-arrived").textContent = d.trucks.arrived;
      document.getElementById("c-unloaded").textContent = d.trucks.unloaded;
      document.getElementById("c-departures").textContent = (d.departures || {}).in_transit || 0;
      document.getElementById("c-delivered-today").textContent = (d.departures || {}).delivered_today || 0;
      document.getElementById("c-req-pending").textContent = d.requisitions.pending;

      // Alerts
      const alerts = d.alerts || [];
      if (alerts.length > 0) {
        document.getElementById("alerts-section").style.display = "block";
        document.getElementById("alerts-body").innerHTML = alerts.map((a) => {
          const colors = { warning: "#d97706", info: "#0284c7", critical: "#dc2626" };
          const bg = { warning: "#fef3c7", info: "#dbeafe", critical: "#fee2e2" };
          return `<div style="display:flex;align-items:center;gap:.6rem;padding:.65rem .85rem;background:${bg[a.severity] || "#f1f5f9"};border-left:4px solid ${colors[a.severity] || "#64748b"};border-radius:6px;margin-bottom:.4rem">
            <span style="flex:1;font-size:.82rem;color:#334155">${AdminUI.esc(a.msg)}</span>
            ${a.link ? `<a href="${a.link}" class="btn btn-sm">Ver</a>` : ""}
          </div>`;
        }).join("");
      }

      document.getElementById("stock-body").innerHTML = (d.stock || []).map((s) =>
        `<tr><td>${AdminUI.esc(s.product)}</td><td>${AdminUI.esc(s.unit)}</td><td style="text-align:right">${AdminUI.fmt(s.qty)}</td></tr>`
      ).join("") || `<tr><td colspan="3" class="empty">Sem stock virtual</td></tr>`;
      document.getElementById("mov-body").innerHTML = (d.recent_movements || []).map((m) =>
        `<tr><td>${AdminUI.fmtDate(m.created_at)}</td><td><span class="badge">${m.type}</span></td>
         <td>${AdminUI.esc(m.product)}</td><td>${AdminUI.fmt(m.qty)}</td>
         <td>${AdminUI.esc(m.plate || "")}</td><td>${AdminUI.esc(m.user_name || "")}</td></tr>`
      ).join("") || `<tr><td colspan="6" class="empty">Sem movimentos</td></tr>`;
    });
  </script>
</body>
</html>
