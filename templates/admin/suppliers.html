<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AQI Operacoes - Fornecedores</title>
  <link rel="stylesheet" href="/static/admin.css">
</head>
<body class="admin-body">
  <div id="layout"></div>
  <main class="admin-main">
    <header class="admin-header">
      <h1>Fornecedores</h1>
      <button class="btn btn-primary" id="btn-new">+ Novo Fornecedor</button>
    </header>
    <section class="admin-section">
      <div class="tbl-wrap">
        <table class="adm-table">
          <thead><tr><th>Nome</th><th>Contacto</th><th>Telefone</th><th>Email</th><th>Notas</th><th></th></tr></thead>
          <tbody id="sup-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div class="modal-overlay" id="modal" style="display:none">
    <div class="modal-card">
      <div class="modal-head"><h2>Fornecedor</h2><button class="modal-x" data-close>&times;</button></div>
      <form id="form" class="modal-form">
        <input type="hidden" name="id">
        <label>Nome *<input type="text" name="name" required></label>
        <label>Pessoa de contacto<input type="text" name="contact_name"></label>
        <label>Telefone<input type="text" name="contact_phone"></label>
        <label>Email<input type="email" name="contact_email"></label>
        <label>Notas<textarea name="notes" rows="3"></textarea></label>
        <button type="submit" class="btn btn-primary">Guardar</button>
      </form>
    </div>
  </div>

  <script src="/static/admin.js"></script>
  <script>
    AdminUI.renderLayout("suppliers");
    async function load() {
      const list = await AdminUI.fetchJSON("/admin/api/suppliers");
      document.getElementById("sup-body").innerHTML = list.map((s) =>
        `<tr><td><strong>${AdminUI.esc(s.name)}</strong></td>
         <td>${AdminUI.esc(s.contact_name || "—")}</td>
         <td>${AdminUI.esc(s.contact_phone || "—")}</td>
         <td>${AdminUI.esc(s.contact_email || "—")}</td>
         <td>${AdminUI.esc(s.notes || "")}</td>
         <td><button class="btn btn-sm" onclick='editSupplier(${JSON.stringify(s)})'>Editar</button>
             <button class="btn btn-sm btn-danger" onclick="removeSupplier(${s.id})">x</button></td></tr>`
      ).join("") || `<tr><td colspan="6" class="empty">Sem fornecedores</td></tr>`;
    }
    function editSupplier(s) {
      const f = document.getElementById("form");
      f.id.value = s.id; f.name.value = s.name;
      f.contact_name.value = s.contact_name || ""; f.contact_phone.value = s.contact_phone || "";
      f.contact_email.value = s.contact_email || ""; f.notes.value = s.notes || "";
      document.getElementById("modal").style.display = "flex";
    }
    async function removeSupplier(id) {
      if (!confirm("Eliminar fornecedor?")) return;
      await AdminUI.fetchJSON("/admin/api/suppliers/" + id, { method: "DELETE" });
      load();
    }
    window.editSupplier = editSupplier; window.removeSupplier = removeSupplier;
    document.getElementById("btn-new").addEventListener("click", () => {
      document.getElementById("form").reset();
      document.getElementById("modal").style.display = "flex";
    });
    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.target));
      const id = data.id;
      delete data.id;
      if (id) await AdminUI.fetchJSON("/admin/api/suppliers/" + id, { method: "PUT", body: data });
      else await AdminUI.fetchJSON("/admin/api/suppliers", { method: "POST", body: data });
      document.getElementById("modal").style.display = "none";
      load();
    });
    document.querySelectorAll("[data-close]").forEach((b) => b.addEventListener("click", () => b.closest(".modal-overlay").style.display = "none"));
    load();
  </script>
</body>
</html>
