<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AQI Operacoes - Planos</title>
  <link rel="stylesheet" href="/static/admin.css">
</head>
<body class="admin-body">
  <div id="layout"></div>
  <main class="admin-main">
    <header class="admin-header">
      <h1>Planos de Entrega</h1>
      <button class="btn btn-primary" id="btn-new">+ Novo Plano</button>
    </header>
    <section class="admin-section">
      <div class="tbl-wrap">
        <table class="adm-table">
          <thead><tr>
            <th>Ref</th><th>Nome</th><th>Provincia</th><th>Distrito</th>
            <th>Data Alvo</th><th>Itens</th><th>Estado</th><th></th>
          </tr></thead>
          <tbody id="plans-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div class="modal-overlay" id="modal" style="display:none">
    <div class="modal-card" style="max-width:640px">
      <div class="modal-head"><h2>Novo Plano</h2><button class="modal-x" data-close>&times;</button></div>
      <form id="form" class="modal-form">
        <label>Referencia<input type="text" name="ref_number"></label>
        <label>Nome *<input type="text" name="name" required></label>
        <label>Provincia alvo<input type="text" name="target_province"></label>
        <label>Distrito alvo<input type="text" name="target_district"></label>
        <label>Data alvo<input type="date" name="target_date"></label>
        <label>Notas<textarea name="notes" rows="2"></textarea></label>

        <div style="border-top:1px solid #e2e8f0;padding-top:.75rem;margin-top:.5rem">
          <strong style="font-size:.78rem;color:#475569">Itens do plano</strong>
          <div id="items-list" style="margin-top:.5rem"></div>
          <button type="button" class="btn btn-sm" id="add-item">+ Adicionar item</button>
        </div>

        <button type="submit" class="btn btn-primary">Criar Plano</button>
        <div id="err" class="auth-error"></div>
      </form>
    </div>
  </div>

  <script src="/static/admin.js"></script>
  <script>
    AdminUI.renderLayout("plans");
    let products = [], warehouses = [];

    async function load() {
      const list = await AdminUI.fetchJSON("/admin/api/plans");
      document.getElementById("plans-body").innerHTML = list.map((p) =>
        `<tr>
          <td>${AdminUI.esc(p.ref_number || "—")}</td>
          <td><a href="/admin/plans/${p.id}" class="link">${AdminUI.esc(p.name)}</a></td>
          <td>${AdminUI.esc(p.target_province || "—")}</td>
          <td>${AdminUI.esc(p.target_district || "—")}</td>
          <td>${p.target_date ? p.target_date.slice(0,10) : "—"}</td>
          <td style="text-align:center">${p.items_count}</td>
          <td><span class="badge">${p.status}</span></td>
          <td><a href="/admin/plans/${p.id}" class="btn btn-sm">Ver</a></td>
        </tr>`
      ).join("") || `<tr><td colspan="8" class="empty">Sem planos criados</td></tr>`;
    }

    function renderItem() {
      return `<div class="item-row" style="display:grid;grid-template-columns:2fr 1fr 1fr 2fr auto;gap:.4rem;margin-bottom:.4rem">
        <select name="product_id" required>
          <option value="">— Produto —</option>
          ${products.map((p) => `<option value="${p.id}" data-unit="${p.default_unit}">${AdminUI.esc(p.name)}</option>`).join("")}
        </select>
        <input type="number" name="qty" step="0.01" placeholder="Qtd" required>
        <input type="text" name="unit" placeholder="kg" value="kg">
        <select name="source_warehouse_id">
          <option value="">— Armazem origem —</option>
          ${warehouses.map((w) => `<option value="${w.id}">${AdminUI.esc(w.name)}</option>`).join("")}
        </select>
        <button type="button" class="btn btn-sm btn-danger" onclick="this.closest('.item-row').remove()">x</button>
      </div>`;
    }

    document.getElementById("btn-new").addEventListener("click", async () => {
      [products, warehouses] = await Promise.all([
        AdminUI.fetchJSON("/admin/api/products"),
        AdminUI.fetchJSON("/admin/api/warehouses"),
      ]);
      document.getElementById("form").reset();
      document.getElementById("items-list").innerHTML = renderItem();
      document.getElementById("err").textContent = "";
      document.getElementById("modal").style.display = "flex";
    });

    document.getElementById("add-item").addEventListener("click", () => {
      document.getElementById("items-list").insertAdjacentHTML("beforeend", renderItem());
    });

    document.getElementById("items-list").addEventListener("change", (e) => {
      if (e.target.name === "product_id") {
        const opt = e.target.selectedOptions[0];
        const unit = opt && opt.dataset.unit;
        if (unit) e.target.closest(".item-row").querySelector("[name='unit']").value = unit;
      }
    });

    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const items = [];
      document.querySelectorAll(".item-row").forEach((row) => {
        const product_id = row.querySelector("[name='product_id']").value;
        const qty = row.querySelector("[name='qty']").value;
        const unit = row.querySelector("[name='unit']").value;
        const source_warehouse_id = row.querySelector("[name='source_warehouse_id']").value;
        if (product_id && qty) {
          items.push({
            product_id: Number(product_id), qty: Number(qty), unit,
            source_warehouse_id: source_warehouse_id ? Number(source_warehouse_id) : null,
          });
        }
      });
      if (items.length === 0) { document.getElementById("err").textContent = "Adicionar pelo menos um item"; return; }
      const data = Object.fromEntries(fd);
      data.items = items;
      if (!data.target_date) delete data.target_date;
      try {
        await AdminUI.fetchJSON("/admin/api/plans", { method: "POST", body: data });
        document.getElementById("modal").style.display = "none";
        load();
      } catch (err) {
        document.getElementById("err").textContent = err.message;
      }
    });
    document.querySelectorAll("[data-close]").forEach((b) =>
      b.addEventListener("click", () => b.closest(".modal-overlay").style.display = "none"));
    load();
  </script>
</body>
</html>
