<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AQI — Serviços de Entrega</title>
  <link rel="stylesheet" href="/static/admin.css">
  <style>
    .svc-counts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.75rem;margin-bottom:1rem}
    .svc-count{background:#f8fafc;border-radius:8px;padding:.75rem .9rem;border-left:3px solid #0f4c75;cursor:pointer;transition:all .15s}
    .svc-count:hover{background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.06)}
    .svc-count.active{background:#fff;border-left-width:5px}
    .svc-count-lbl{font-size:.65rem;text-transform:uppercase;letter-spacing:.05em;color:#64748b;font-weight:700}
    .svc-count-val{font-size:1.4rem;font-weight:800;line-height:1.1;margin-top:.15rem}
    .svc-count-sub{font-size:.7rem;color:#94a3b8;margin-top:.15rem}
    .svc-count-draft{border-left-color:#64748b}.svc-count-draft .svc-count-val{color:#475569}
    .svc-count-transit{border-left-color:#d97706}.svc-count-transit .svc-count-val{color:#d97706}
    .svc-count-delivered{border-left-color:#16a34a}.svc-count-delivered .svc-count-val{color:#16a34a}
    .svc-count-cancelled{border-left-color:#dc2626}.svc-count-cancelled .svc-count-val{color:#dc2626}

    .svc-filters{display:grid;grid-template-columns:repeat(5,1fr);gap:.6rem;margin-bottom:1rem}
    .svc-filters label{display:block;font-size:.7rem;text-transform:uppercase;color:#64748b;font-weight:600;margin-bottom:.2rem}
    .svc-filters select,.svc-filters input{width:100%;padding:.45rem .55rem;border:1px solid #cbd5e1;border-radius:6px;font-size:.82rem}

    .badge{display:inline-block;padding:.18rem .55rem;border-radius:4px;font-size:.7rem;font-weight:700;letter-spacing:.02em}
    .badge-draft{background:#f1f5f9;color:#475569}
    .badge-in_transit{background:#fef3c7;color:#92400e}
    .badge-delivered{background:#dcfce7;color:#166534}
    .badge-cancelled{background:#fee2e2;color:#991b1b}

    /* Bulk action bar — sticky footer quando há selecção */
    .bulk-bar{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);
      background:#0f172a;color:#fff;padding:.6rem 1rem;border-radius:10px;
      box-shadow:0 12px 40px rgba(0,0,0,.3);display:none;align-items:center;gap:.75rem;z-index:200;
      animation:bulk-fade-in .15s ease}
    .bulk-bar.show{display:flex}
    .bulk-bar .bulk-count{font-weight:700;font-size:.85rem}
    .bulk-bar .btn-bulk{background:#1e293b;color:#fff;border:1px solid #334155;font-size:.78rem;padding:.4rem .75rem}
    .bulk-bar .btn-bulk:hover{background:#334155}
    .bulk-bar .btn-bulk-deliver{background:#16a34a;border-color:#16a34a}
    .bulk-bar .btn-bulk-deliver:hover{background:#15803d}
    .bulk-bar .btn-bulk-cancel{background:transparent;border-color:#fca5a5;color:#fca5a5}
    .bulk-bar .btn-bulk-cancel:hover{background:rgba(248,113,113,.12);color:#fff}
    .bulk-bar .btn-bulk-clear{color:#94a3b8;background:transparent;border:0;font-size:.75rem;cursor:pointer}
    @keyframes bulk-fade-in{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}

    .check-col-svc{width:32px}
    .check-col-svc input{cursor:pointer;width:15px;height:15px}
    tr.row-selected{background:#dbeafe!important}

    /* Cancel modal (reused style) */
    .cm-modal{position:fixed;inset:0;background:rgba(15,23,42,.7);display:none;
      align-items:center;justify-content:center;z-index:9999;padding:1rem}
    .cm-modal.show{display:flex}
    .cm-box{background:#fff;border-radius:12px;max-width:480px;width:100%;padding:1.5rem}
    .cm-box h2{margin:0 0 .5rem;font-size:1.05rem}
    .cm-box label{display:block;font-size:.7rem;text-transform:uppercase;color:#64748b;font-weight:600;margin-bottom:.25rem}
    .cm-box select,.cm-box textarea{width:100%;padding:.55rem .65rem;border:1px solid #cbd5e1;border-radius:6px;font-size:.85rem;font-family:inherit;box-sizing:border-box}
    .cm-actions{display:flex;justify-content:flex-end;gap:.5rem;margin-top:1.25rem}
    .cm-error{display:none;background:#fee2e2;color:#991b1b;border-left:3px solid #dc2626;padding:.6rem;border-radius:6px;font-size:.78rem;margin-top:.7rem}
    .cm-error.show{display:block}
  </style>
</head>
<body class="admin-body">
  <div id="layout"></div>
  <main class="admin-main">
    <header class="admin-header">
      <h1>Serviços de Entrega</h1>
      <span class="admin-sub">Tudo o que foi e está a ser entregue</span>
    </header>

    <section class="admin-section">
      <div class="svc-counts" id="counts"></div>

      <div class="svc-filters">
        <div>
          <label>Estado</label>
          <select id="f-status">
            <option value="">Todos</option>
            <option value="draft">Rascunho</option>
            <option value="in_transit">Em Trânsito</option>
            <option value="delivered">Entregue</option>
            <option value="cancelled">Cancelado</option>
          </select>
        </div>
        <div>
          <label>Província</label>
          <input id="f-province" type="text" placeholder="Província">
        </div>
        <div>
          <label>Distrito</label>
          <input id="f-district" type="text" placeholder="Distrito">
        </div>
        <div>
          <label>Matrícula</label>
          <input id="f-plate" type="text" placeholder="AAB...">
        </div>
        <div>
          <label>Origem</label>
          <input id="f-supplier" type="text" placeholder="Fornecedor">
        </div>
      </div>
      <div class="filter-chips" id="filter-chips"></div>
      <div style="display:flex;justify-content:flex-end;gap:.5rem;margin-top:.5rem">
        <button class="btn" id="btn-export-csv">Exportar CSV</button>
      </div>

      <div class="tbl-wrap">
        <table class="adm-table" id="svc-table">
          <thead><tr id="svc-thead-row"></tr></thead>
          <tbody id="tbl-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- Bulk action bar -->
  <div class="bulk-bar" id="bulk-bar">
    <span class="bulk-count" id="bulk-count">0 seleccionados</span>
    <button class="btn btn-bulk btn-bulk-deliver" id="btn-bulk-deliver">Marcar Entregue</button>
    <button class="btn btn-bulk btn-bulk-cancel" id="btn-bulk-cancel">Cancelar</button>
    <button class="btn-bulk-clear" id="btn-bulk-clear">Limpar selecção ✕</button>
  </div>

  <!-- Cancel modal (single + bulk) -->
  <div class="cm-modal" id="cm-modal">
    <div class="cm-box">
      <h2 id="cm-title">Cancelar Serviços</h2>
      <p style="font-size:.78rem;color:#64748b;margin:.3rem 0 .5rem" id="cm-desc">…</p>
      <div style="margin-top:.7rem">
        <label>Motivo *</label>
        <select id="cm-category"></select>
      </div>
      <div style="margin-top:.7rem">
        <label>Notas (opcional)</label>
        <textarea id="cm-reason" rows="3" placeholder="Detalhes adicionais sobre o cancelamento…"></textarea>
      </div>
      <div class="cm-error" id="cm-error"></div>
      <div class="cm-actions">
        <button class="btn" id="cm-back">Voltar</button>
        <button class="btn btn-cancel" id="cm-confirm">Confirmar cancelamento</button>
      </div>
    </div>
  </div>

  <script src="/static/admin.js"></script>
  <script>
    (function () {
      const { fetchJSON, fmt, fmtDate, esc, sortRows, sortArrow, bindSortable,
              exportCSV, urlState, renderFilterChips } = window.AdminUI;
      const $ = (s) => document.querySelector(s);

      const STATUS_LABELS = { draft: "Rascunho", in_transit: "Em Trânsito", delivered: "Entregue", cancelled: "Cancelado" };

      // Definição das colunas — primeira é checkbox de seleção bulk
      const COLS = [
        { key: "_check",           label: "",            sortable: false, checkCol: true },
        { key: "service_number",   label: "Nº Serviço",  sortable: true,  type: "string" },
        { key: "status",           label: "Estado",      sortable: true,  type: "string" },
        { key: "province",         label: "Província",   sortable: true,  type: "string" },
        { key: "district",         label: "Distrito",    sortable: true,  type: "string" },
        { key: "truck_plate",      label: "Matrícula",   sortable: true,  type: "string" },
        { key: "origem_supplier",  label: "Origem",      sortable: true,  type: "string" },
        { key: "n_beneficiaries",  label: "Benef.",      sortable: true,  type: "number", numCol: true },
        { key: "n_items",          label: "Itens",       sortable: true,  type: "number", numCol: true },
        { key: "total_kg",         label: "Total kg",    sortable: true,  type: "number", numCol: true },
        { key: "created_at",       label: "Criado",      sortable: true,  type: "date" },
        { key: null,               label: "",            sortable: false, type: null },
      ];

      let activeStatus = "";
      let timer = null;
      let allRows = [];
      let selectedIds = new Set();
      let cancelCategories = null;
      const sort = { sortKey: "created_at", sortAsc: false, render: () => render() };

      function renderCounts(counts) {
        const total = Object.values(counts).reduce((s, v) => s + v.n, 0);
        const totalKg = Object.values(counts).reduce((s, v) => s + (v.kg || 0), 0);
        const cards = ["draft", "in_transit", "delivered", "cancelled"].map((k) => {
          const c = counts[k] || { n: 0, kg: 0 };
          const sel = activeStatus === k ? "active" : "";
          return `<div class="svc-count svc-count-${k} ${sel}" data-status="${k}">
            <div class="svc-count-lbl">${STATUS_LABELS[k]}</div>
            <div class="svc-count-val">${fmt(c.n)}</div>
            <div class="svc-count-sub">${fmt(c.kg)} kg</div>
          </div>`;
        });
        cards.push(`<div class="svc-count ${activeStatus === '' ? 'active' : ''}" data-status="">
          <div class="svc-count-lbl">Total</div>
          <div class="svc-count-val">${fmt(total)}</div>
          <div class="svc-count-sub">${fmt(totalKg)} kg</div>
        </div>`);
        $("#counts").innerHTML = cards.join("");
        document.querySelectorAll(".svc-count").forEach((el) => {
          el.addEventListener("click", () => {
            activeStatus = el.dataset.status || "";
            $("#f-status").value = activeStatus;
            load();
          });
        });
      }

      function renderHeader() {
        const html = COLS.map((c) => {
          if (c.checkCol) return `<th class="check-col-svc"><input type="checkbox" id="check-all-svc" title="Selecc. todos"></th>`;
          const cls = c.numCol ? "num" : "";
          if (!c.sortable) return `<th class="${cls}">${esc(c.label)}</th>`;
          return `<th class="${cls}" data-sort="${c.key}" data-sort-type="${c.type}">${esc(c.label)}${sortArrow(c.key, sort.sortKey, sort.sortAsc)}</th>`;
        }).join("");
        $("#svc-thead-row").innerHTML = html;
        bindSortable($("#svc-table"), sort);
        const cAll = $("#check-all-svc");
        if (cAll) {
          // Select all toggles only the rows currently visible (sorted/filtered)
          const visible = currentSorted();
          cAll.checked = visible.length > 0 && visible.every((r) => selectedIds.has(r.id));
          cAll.onclick = () => {
            if (cAll.checked) visible.forEach((r) => selectedIds.add(r.id));
            else visible.forEach((r) => selectedIds.delete(r.id));
            render();
          };
        }
      }

      function currentSorted() {
        const col = COLS.find((c) => c.key === sort.sortKey);
        return sortRows(allRows, sort.sortKey, sort.sortAsc, col?.type);
      }

      function renderRows(rows) {
        if (!rows.length) {
          $("#tbl-body").innerHTML = `<tr><td colspan="${COLS.length}" style="text-align:center;color:#94a3b8;padding:2rem">Sem serviços com este filtro.</td></tr>`;
          return;
        }
        $("#tbl-body").innerHTML = rows.map((r) => {
          const checked = selectedIds.has(r.id);
          return `<tr class="${checked ? "row-selected" : ""}" data-id="${r.id}">
            <td class="check-col-svc"><input type="checkbox" class="row-check" ${checked ? "checked" : ""}></td>
            <td><a href="/admin/servicos/${r.id}" style="color:#0f4c75;font-weight:600">${esc(r.service_number)}</a></td>
            <td><span class="badge badge-${esc(r.status)}">${STATUS_LABELS[r.status] || r.status}</span></td>
            <td>${esc(r.province)}</td>
            <td>${esc(r.district)}</td>
            <td><code style="font-size:.72rem">${esc(r.truck_plate || "—")}</code></td>
            <td>${esc(r.origem_supplier || "—")}</td>
            <td class="num">${fmt(r.n_beneficiaries)}</td>
            <td class="num">${fmt(r.n_items)}</td>
            <td class="num">${fmt(r.total_kg)}</td>
            <td>${fmtDate(r.created_at)}</td>
            <td><a href="/admin/servicos/${r.id}" class="btn btn-sm">Ver</a></td>
          </tr>`;
        }).join("");
        // Bind checkboxes
        document.querySelectorAll("#tbl-body tr[data-id]").forEach((tr) => {
          const cb = tr.querySelector(".row-check");
          cb.addEventListener("click", (e) => {
            e.stopPropagation();
            const id = Number(tr.dataset.id);
            if (cb.checked) selectedIds.add(id); else selectedIds.delete(id);
            tr.classList.toggle("row-selected", cb.checked);
            updateBulkBar();
          });
        });
      }

      function render() {
        renderHeader();
        renderRows(currentSorted());
        updateBulkBar();
      }

      // ── Bulk action bar ───────────────────────────────────────
      function updateBulkBar() {
        const bar = $("#bulk-bar");
        const n = selectedIds.size;
        if (n === 0) { bar.classList.remove("show"); return; }
        bar.classList.add("show");
        $("#bulk-count").textContent = n + " seleccionado" + (n === 1 ? "" : "s");
        // Botão "Marcar Entregue" só faz sentido se TODOS os seleccionados
        // forem in_transit (entregar uma draft sem dispatch é nonsense).
        const selected = allRows.filter((r) => selectedIds.has(r.id));
        const allInTransit = selected.length > 0 && selected.every((r) => r.status === "in_transit");
        const noneDelivered = selected.every((r) => r.status !== "delivered" && r.status !== "cancelled");
        $("#btn-bulk-deliver").disabled = !allInTransit;
        $("#btn-bulk-deliver").style.opacity = allInTransit ? "1" : ".5";
        $("#btn-bulk-cancel").disabled = !noneDelivered;
        $("#btn-bulk-cancel").style.opacity = noneDelivered ? "1" : ".5";
      }

      async function loadCancelCategories() {
        if (!cancelCategories) {
          const r = await fetchJSON("/admin/api/distribution/cancel-categories");
          cancelCategories = r.categories || {};
        }
        return cancelCategories;
      }

      async function openCancelModal() {
        const cats = await loadCancelCategories();
        $("#cm-category").innerHTML = '<option value="">— Escolher motivo —</option>' +
          Object.entries(cats).map(([k, v]) => `<option value="${k}">${esc(v)}</option>`).join("");
        $("#cm-title").textContent = "Cancelar " + selectedIds.size + " serviço" + (selectedIds.size === 1 ? "" : "s");
        $("#cm-desc").innerHTML = `Cancelar liberta o saldo dos beneficiários nestes serviços. Esta acção <strong>não pode ser revertida</strong>.`;
        $("#cm-reason").value = "";
        $("#cm-error").classList.remove("show");
        $("#cm-modal").classList.add("show");
      }

      async function bulkDeliver() {
        const ids = [...selectedIds];
        if (!confirm(`Marcar ${ids.length} serviço${ids.length === 1 ? "" : "s"} como ENTREGUE? Esta acção não é reversível.`)) return;
        try {
          const r = await fetchJSON("/admin/api/distribution/services/bulk/deliver", {
            method: "POST", body: { ids },
          });
          alert(`OK: ${r.ok.length} entregue${r.ok.length === 1 ? "" : "s"}` +
            (r.failed.length ? `\nFalhou: ${r.failed.length}\n` + r.failed.map((f) => `• ${f.id}: ${f.error}`).join("\n") : ""));
          selectedIds.clear();
          load();
        } catch (e) { alert("Erro: " + e.message); }
      }

      async function bulkCancelConfirm() {
        const errBox = $("#cm-error");
        errBox.classList.remove("show");
        const category = $("#cm-category").value;
        const reason = $("#cm-reason").value.trim();
        if (!category) {
          errBox.textContent = "Escolha um motivo de cancelamento";
          errBox.classList.add("show");
          return;
        }
        try {
          const ids = [...selectedIds];
          const r = await fetchJSON("/admin/api/distribution/services/bulk/cancel", {
            method: "POST", body: { ids, category, reason: reason || null },
          });
          $("#cm-modal").classList.remove("show");
          alert(`OK: ${r.ok.length} cancelado${r.ok.length === 1 ? "" : "s"}` +
            (r.failed.length ? `\nFalhou: ${r.failed.length}\n` + r.failed.map((f) => `• ${f.id}: ${f.error}`).join("\n") : ""));
          selectedIds.clear();
          load();
        } catch (e) {
          errBox.textContent = "Erro: " + e.message;
          errBox.classList.add("show");
        }
      }

      // URL ↔ filter state sync (Fase 6)
      const urlSync = urlState({
        "f-status":   "status",
        "f-province": "province",
        "f-district": "district",
        "f-plate":    "plate",
        "f-supplier": "supplier",
      }, { onPopState: () => load() });

      function getFilters() {
        return {
          status:   $("#f-status").value,
          province: $("#f-province").value.trim(),
          district: $("#f-district").value.trim(),
          plate:    $("#f-plate").value.trim(),
          supplier: $("#f-supplier").value.trim(),
        };
      }

      function renderChips() {
        const f = getFilters();
        renderFilterChips($("#filter-chips"), [
          { key: "f-status",   label: "Estado",   value: f.status ? (STATUS_LABELS[f.status] || f.status) : "" },
          { key: "f-province", label: "Província", value: f.province },
          { key: "f-district", label: "Distrito",  value: f.district },
          { key: "f-plate",    label: "Matrícula", value: f.plate },
          { key: "f-supplier", label: "Origem",    value: f.supplier },
        ], (key) => {
          if (key === "__all__") {
            ["f-status","f-province","f-district","f-plate","f-supplier"].forEach((id) => $("#" + id).value = "");
          } else {
            $("#" + key).value = "";
          }
          load();
        });
      }

      async function load() {
        urlSync.write();
        const params = new URLSearchParams();
        const f = getFilters();
        if (f.status)   params.set("status", f.status);
        if (f.province) params.set("province", f.province);
        if (f.district) params.set("district", f.district);
        if (f.plate)    params.set("plate", f.plate);
        if (f.supplier) params.set("supplier", f.supplier);
        renderChips();
        try {
          const data = await fetchJSON("/admin/api/distribution/services?" + params);
          renderCounts(data.counts || {});
          allRows = data.rows || [];
          // Drop selecções que já não estão no resultset actual
          const ids = new Set(allRows.map((r) => r.id));
          selectedIds = new Set([...selectedIds].filter((id) => ids.has(id)));
          render();
        } catch (e) {
          $("#tbl-body").innerHTML = `<tr><td colspan="${COLS.length}" style="color:#dc2626;padding:1rem">Erro: ${esc(e.message)}</td></tr>`;
        }
      }

      function doExportCSV() {
        const sorted = currentSorted();
        const visibleSelected = selectedIds.size > 0
          ? sorted.filter((r) => selectedIds.has(r.id))
          : sorted;
        exportCSV(visibleSelected, {
          filename: "servicos",
          columns: [
            { key: "service_number",  label: "Nº Serviço" },
            { key: "status",          label: "Estado", format: (v) => STATUS_LABELS[v] || v },
            { key: "province",        label: "Província" },
            { key: "district",        label: "Distrito" },
            { key: "truck_plate",     label: "Matrícula" },
            { key: "truck_plate_2",   label: "Matrícula Reboque" },
            { key: "driver_name",     label: "Motorista" },
            { key: "driver_phone",    label: "Telefone" },
            { key: "origem_supplier", label: "Origem" },
            { key: "n_beneficiaries", label: "Beneficiários" },
            { key: "n_items",         label: "Itens" },
            { key: "total_kg",        label: "Total kg" },
            { key: "truck_capacity_kg", label: "Capacidade kg" },
            { key: "created_at",      label: "Criado", format: (v) => v ? fmtDate(v) : "" },
            { key: "dispatched_at",   label: "Saída", format: (v) => v ? fmtDate(v) : "" },
            { key: "delivered_at",    label: "Entregue", format: (v) => v ? fmtDate(v) : "" },
            { key: "cancellation_category", label: "Motivo Cancel." },
          ],
        });
      }

      function debounced(fn) { return () => { clearTimeout(timer); timer = setTimeout(fn, 250); }; }

      document.addEventListener("DOMContentLoaded", async () => {
        // Restore filters from URL (suporta links bookmarkáveis)
        urlSync.read();
        activeStatus = $("#f-status").value;

        $("#f-status").addEventListener("change", () => { activeStatus = $("#f-status").value; load(); });
        ["f-province", "f-district", "f-plate", "f-supplier"].forEach((id) =>
          $("#" + id).addEventListener("input", debounced(load))
        );

        // Bulk handlers
        $("#btn-bulk-deliver").addEventListener("click", bulkDeliver);
        $("#btn-bulk-cancel").addEventListener("click", openCancelModal);
        $("#btn-bulk-clear").addEventListener("click", () => { selectedIds.clear(); render(); });
        $("#cm-back").addEventListener("click", () => $("#cm-modal").classList.remove("show"));
        $("#cm-modal").addEventListener("click", (e) => {
          if (e.target.id === "cm-modal") e.target.classList.remove("show");
        });
        $("#cm-confirm").addEventListener("click", bulkCancelConfirm);

        // Export
        $("#btn-export-csv").addEventListener("click", doExportCSV);

        await load();
      });
    })();
    AdminUI.renderLayout("servicos");
  </script>
</body>
</html>
