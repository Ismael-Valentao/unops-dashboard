<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AQI — Fornecido vs Meta</title>
  <link rel="stylesheet" href="/static/admin.css">
  <style>
    .forn-ctrl {
      display: flex; gap: .75rem; flex-wrap: wrap; align-items: end;
      margin-bottom: 1rem; padding: .85rem 1rem;
      background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px;
    }
    .forn-ctrl label {
      display: block; font-size: .68rem; text-transform: uppercase;
      letter-spacing: .04em; color: #64748b; font-weight: 700; margin-bottom: .3rem;
    }
    .forn-ctrl input, .forn-ctrl select {
      padding: .45rem .6rem; border: 1px solid #cbd5e1; border-radius: 6px;
      font-size: .85rem; background: #fff;
    }
    .forn-ctrl .btn {
      padding: .5rem 1rem; background: #0f4c75; color: #fff; border: 0;
      border-radius: 6px; cursor: pointer; font-size: .85rem; font-weight: 600;
    }
    .forn-ctrl .btn:hover { background: #1e6ba8; }
    .forn-ctrl .btn-sec { background: #fff; color: #0f4c75; border: 1px solid #cbd5e1; }
    .forn-ctrl .btn-sec:hover { background: #f1f5f9; }
    .cache-info {
      font-size: .68rem; color: #94a3b8; align-self: center;
      padding: 0 .35rem; font-variant-numeric: tabular-nums;
    }
    .cache-info.fresh { color: #15803d; }
    .cache-info.stale { color: #b45309; }
    .cache-info.loading { color: #2563eb; }

    .forn-kpis {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: .75rem; margin-bottom: 1rem;
    }
    /* Cards de Produto vs Contratado */
    .prod-cards {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: .85rem;
    }
    .prod-card {
      background: #fff; border: 1px solid #e2e8f0; border-radius: 10px;
      padding: 1rem 1.1rem; border-left: 5px solid #94a3b8;
      display: flex; flex-direction: column; gap: .5rem;
    }
    .prod-card.cls-over     { border-left-color: #16a34a; }
    .prod-card.cls-complete { border-left-color: #15803d; }
    .prod-card.cls-high     { border-left-color: #84cc16; }
    .prod-card.cls-mid      { border-left-color: #d97706; }
    .prod-card.cls-low      { border-left-color: #dc2626; }
    .prod-card .name {
      font-size: 1.35rem; font-weight: 800; color: #0f172a;
      letter-spacing: -.01em; line-height: 1.1;
    }
    .prod-card .nums {
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: .4rem;
      font-size: .72rem; color: #64748b; font-weight: 600;
    }
    .prod-card .nums > div {
      display: flex; flex-direction: column;
    }
    .prod-card .nums .lbl {
      font-size: .58rem; text-transform: uppercase; letter-spacing: .04em;
      color: #94a3b8;
    }
    .prod-card .nums .v {
      font-size: .95rem; font-weight: 700; color: #0f172a;
      font-variant-numeric: tabular-nums;
    }
    .prod-card .nums .v.forn { color: #15803d; }
    .prod-card .nums .v.pend { color: #b45309; }
    .prod-card .progress-wrap {
      height: 10px; background: #f1f5f9; border-radius: 5px; overflow: hidden;
      position: relative;
    }
    .prod-card .progress-wrap > div {
      height: 100%; transition: width .3s ease;
    }
    .prod-card .progress-wrap > div.full { background: #16a34a; }
    .prod-card .progress-wrap > div.high { background: #84cc16; }
    .prod-card .progress-wrap > div.mid  { background: #d97706; }
    .prod-card .progress-wrap > div.low  { background: #dc2626; }
    .prod-card .pct-row {
      display: flex; justify-content: space-between; align-items: baseline;
      font-size: .72rem; color: #64748b;
    }
    .prod-card .pct-row .pct-val {
      font-size: 1.05rem; font-weight: 700; color: #0f172a;
      font-variant-numeric: tabular-nums;
    }
    /* Lista de fornecedores quando há pendente */
    .prod-card .supps-block {
      margin-top: .35rem; padding-top: .55rem;
      border-top: 1px dashed #e2e8f0;
    }
    .prod-card .supps-title {
      font-size: .58rem; text-transform: uppercase; letter-spacing: .04em;
      color: #94a3b8; font-weight: 700; margin-bottom: .3rem;
    }
    .prod-card .supp-row {
      display: grid; grid-template-columns: 1fr auto 30px;
      gap: .5rem; align-items: center;
      font-size: .72rem; padding: .15rem 0;
    }
    .prod-card .supp-row .sname {
      color: #334155; font-weight: 600;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .prod-card .supp-row .sname.ghost { color: #94a3b8; font-style: italic; }
    .prod-card .supp-row .sqty {
      color: #64748b; font-variant-numeric: tabular-nums; font-weight: 500;
      font-size: .68rem;
    }
    .prod-card .supp-row .spct {
      font-size: .68rem; font-weight: 700;
      font-variant-numeric: tabular-nums; text-align: right;
    }
    .prod-card .supp-row .spct.over     { color: #16a34a; }
    .prod-card .supp-row .spct.complete { color: #15803d; }
    .prod-card .supp-row .spct.high     { color: #84cc16; }
    .prod-card .supp-row .spct.mid      { color: #d97706; }
    .prod-card .supp-row .spct.low      { color: #dc2626; }
    .kpi-card {
      background: #fff; border: 1px solid #e2e8f0; border-radius: 8px;
      padding: .85rem 1rem; border-left: 4px solid #0f4c75;
    }
    .kpi-card .lbl { font-size: .65rem; text-transform: uppercase;
      letter-spacing: .05em; color: #64748b; font-weight: 700; }
    .kpi-card .val { font-size: 1.6rem; font-weight: 800; color: #0f172a;
      line-height: 1.1; margin-top: .25rem; font-variant-numeric: tabular-nums; }
    .kpi-card .sub { font-size: .7rem; color: #94a3b8; margin-top: .2rem; }
    .kpi-card.green { border-left-color: #16a34a; }
    .kpi-card.green .val { color: #15803d; }
    .kpi-card.amber { border-left-color: #d97706; }
    .kpi-card.amber .val { color: #b45309; }
    .kpi-card.red   { border-left-color: #dc2626; }
    .kpi-card.red   .val { color: #b91c1c; }
    .kpi-card.purple{ border-left-color: #7c3aed; }
    .kpi-card.purple .val { color: #5b21b6; }

    .supplier-grid { display: flex; flex-direction: column; gap: .55rem; }
    .sup-card {
      background: #fff; border: 1px solid #e2e8f0; border-radius: 8px;
      overflow: hidden;
    }
    .sup-card:hover { box-shadow: 0 2px 8px rgba(15,23,42,.06); }
    .sup-card.open { box-shadow: 0 4px 12px rgba(15,23,42,.09); border-color: #93c5fd; }
    .sup-head {
      display: grid;
      grid-template-columns: 1fr auto auto auto;
      gap: .85rem; align-items: center;
      padding: .7rem 1rem; cursor: pointer; user-select: none;
      position: relative;
    }
    .sup-head::before {
      content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
      background: #94a3b8;
    }
    .sup-card.over     .sup-head::before { background: #16a34a; }
    .sup-card.complete .sup-head::before { background: #15803d; }
    .sup-card.high     .sup-head::before { background: #84cc16; }
    .sup-card.mid      .sup-head::before { background: #d97706; }
    .sup-card.low      .sup-head::before { background: #dc2626; }
    .sup-card.no-meta  .sup-head::before { background: #94a3b8; }

    .sup-head .name {
      font-weight: 700; color: #0f172a; font-size: .95rem;
    }
    .sup-head .name .acct {
      display: inline-block; background: #e0f2fe; color: #075985;
      font-size: .62rem; padding: .05rem .35rem; border-radius: 99px;
      margin-left: .35rem; font-weight: 600;
    }
    .sup-head .name .origin {
      display: block; font-size: .68rem; color: #94a3b8;
      font-weight: 500; margin-top: .12rem;
    }
    .sup-head .name .no-meta-tag {
      display: inline-block; background: #f1f5f9; color: #475569;
      font-size: .58rem; padding: .05rem .35rem; border-radius: 99px;
      margin-left: .35rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: .03em;
    }
    .sup-head .name .ghost-tag {
      display: inline-block; background: #fef3c7; color: #92400e;
      font-size: .58rem; padding: .05rem .35rem; border-radius: 99px;
      margin-left: .35rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: .03em;
    }
    .sup-card.ghost { opacity: .85; background: #fffbeb; }
    .sup-card.ghost .sup-head::before { background: #fde68a; }
    .sup-head .metric {
      display: flex; flex-direction: column; align-items: flex-end;
      min-width: 110px;
    }
    .sup-head .metric .lbl {
      font-size: .58rem; text-transform: uppercase; letter-spacing: .04em;
      color: #94a3b8; font-weight: 700;
    }
    .sup-head .metric .qty {
      font-size: 1.05rem; font-weight: 700;
      font-variant-numeric: tabular-nums; color: #0f172a;
      line-height: 1.15;
    }
    .sup-head .metric .sub {
      font-size: .65rem; color: #64748b; margin-top: .05rem;
      font-variant-numeric: tabular-nums;
    }
    .sup-head .metric.forn .qty { color: #15803d; }
    .sup-head .metric.pend .qty { color: #b45309; }
    .sup-head .metric.meta .qty { color: #475569; }
    .sup-head .progress {
      width: 100px; margin-top: .25rem;
      height: 6px; background: #f1f5f9; border-radius: 3px; overflow: hidden;
    }
    .sup-head .progress > div { height: 100%; }
    .sup-head .progress > div.over     { background: #16a34a; }
    .sup-head .progress > div.complete { background: #15803d; }
    .sup-head .progress > div.high     { background: #84cc16; }
    .sup-head .progress > div.mid      { background: #d97706; }
    .sup-head .progress > div.low      { background: #dc2626; }
    .sup-head .pct {
      font-size: .65rem; color: #64748b; margin-top: .15rem;
      font-variant-numeric: tabular-nums; text-align: right;
    }

    .sup-body { display: none; padding: 0; }
    .sup-card.open .sup-body { display: block; }
    .sku-tbl {
      width: 100%; border-collapse: collapse; font-size: .8rem;
      background: #f8fafc;
    }
    .sku-tbl thead { background: #f1f5f9; color: #475569; }
    .sku-tbl thead th {
      padding: .45rem .75rem; text-align: left; font-weight: 700;
      font-size: .65rem; text-transform: uppercase; letter-spacing: .04em;
      border-bottom: 1px solid #cbd5e1;
    }
    .sku-tbl thead th.num { text-align: right; }
    .sku-tbl tbody td {
      padding: .5rem .75rem; border-bottom: 1px solid #f1f5f9;
    }
    .sku-tbl tbody td.num { text-align: right; font-variant-numeric: tabular-nums; }
    .sku-tbl tbody td.qty-meta  { color: #475569; }
    .sku-tbl tbody td.qty-forn  { color: #15803d; font-weight: 600; }
    .sku-tbl tbody td.qty-pend  { color: #b45309; font-weight: 500; }
    .sku-tbl tbody td.qty-over  { color: #16a34a; font-weight: 700; }
    .sku-tbl .unit {
      font-size: .65rem; color: #94a3b8; font-weight: 500; margin-left: 2px;
    }
    .sku-tbl tbody tr.no-meta-row {
      background: #fafafa;
    }
    .sku-tbl tbody tr.no-meta-row td { color: #64748b; }
    .sku-tbl tbody tr.is-saco-row {
      background: #faf5ff;
    }
    .sku-tbl tbody tr.is-saco-row td { color: #5b21b6; }
    .pct-bar {
      display: inline-flex; align-items: center; gap: .4rem;
      font-variant-numeric: tabular-nums;
    }
    .pct-bar .bar {
      width: 60px; height: 5px; background: #e2e8f0; border-radius: 3px; overflow: hidden;
    }
    .pct-bar .bar > div { height: 100%; }
    .pct-bar .bar > div.over     { background: #16a34a; }
    .pct-bar .bar > div.complete { background: #15803d; }
    .pct-bar .bar > div.high     { background: #84cc16; }
    .pct-bar .bar > div.mid      { background: #d97706; }
    .pct-bar .bar > div.low      { background: #dc2626; }

    .loading { padding: 2rem; text-align: center; color: #94a3b8; font-style: italic; }
    .error { padding: 1rem; background: #fef2f2; border: 1px solid #fecaca;
      border-radius: 6px; color: #b91c1c; }
  </style>
</head>
<body class="admin-body">
  <div id="layout"></div>
  <main class="admin-main">
    <header class="admin-header">
      <h1>Fornecido vs Meta</h1>
      <span class="admin-sub">
        <span style="color:#15803d;font-weight:600">RECEBIDO</span> = TRA + FIN ·
        <span style="color:#b45309;font-weight:600">PENDENTE</span> = <strong>Meta − Recebido</strong> (falta para meta) ·
        sacos herméticos em <strong>un</strong>
      </span>
    </header>

    <section class="admin-section">

      <div class="forn-ctrl">
        <div><label>De</label><input type="date" id="f-from"></div>
        <div><label>Até</label><input type="date" id="f-to"></div>
        <div style="margin-left:auto;display:flex;gap:.5rem;flex-wrap:wrap">
          <button class="btn" id="btn-load">Carregar</button>
          <button class="btn btn-sec" id="btn-force" title="Forçar refresh (ignora cache 5min)">↻ Fresh</button>
          <button class="btn btn-sec" id="btn-expand-all">Expandir tudo</button>
          <button class="btn btn-sec" id="btn-preset-30">30d</button>
          <button class="btn btn-sec" id="btn-preset-60">60d</button>
          <span id="cache-info" class="cache-info"></span>
        </div>
      </div>

      <div id="prod-section" style="display:none;margin-bottom:1rem">
        <h3 style="font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:#64748b;font-weight:700;margin:0 0 .6rem">Total Fornecido por Produto vs. Contratado</h3>
        <div id="prod-kpis"></div>
      </div>

      <div id="suppliers-wrap" class="supplier-grid">
        <div class="loading">Carregue para começar.</div>
      </div>
    </section>
  </main>

  <script src="/static/admin.js"></script>
  <script>
    (function () {
      const { fetchJSON, fmt, esc, toast } = window.AdminUI;
      const $ = (s) => document.querySelector(s);
      const $$ = (s) => Array.from(document.querySelectorAll(s));

      function ymd(d) {
        return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
      }
      const today = new Date(); today.setHours(0,0,0,0);
      const d60 = new Date(today); d60.setDate(d60.getDate() - 60);
      $("#f-from").value = ymd(d60);
      $("#f-to").value   = ymd(today);

      function fmtNum(n) { return (Number(n) || 0).toLocaleString("pt-PT"); }
      function fmtTon(kg) {
        const t = kg / 1000;
        if (t >= 100) return fmt(Math.round(t));
        if (t >= 10)  return t.toFixed(1);
        return t.toFixed(2);
      }
      function pctClass(pct) {
        if (pct == null) return "";
        if (pct >= 100) return "over";
        if (pct >= 95)  return "complete";
        if (pct >= 70)  return "high";
        if (pct >= 40)  return "mid";
        return "low";
      }
      function setCacheInfo(cache) {
        const el = $("#cache-info");
        if (!cache) { el.textContent = ""; el.className = "cache-info"; return; }
        if (cache.from_cache) {
          const age = cache.age_seconds, min = Math.floor(age / 60);
          el.textContent = "· " + (min > 0 ? `Cache ${min}min` : `Cache ${age}s`);
          el.className = "cache-info " + (age > 240 ? "stale" : "fresh");
        } else {
          el.textContent = "· Fresh";
          el.className = "cache-info fresh";
        }
      }

      function pctCardClass(pct) {
        if (pct == null) return "";
        if (pct >= 100) return "cls-over";
        if (pct >= 95)  return "cls-complete";
        if (pct >= 70)  return "cls-high";
        if (pct >= 40)  return "cls-mid";
        return "cls-low";
      }
      function pctBarClass(pct) {
        if (pct == null) return "";
        if (pct >= 100) return "full";
        if (pct >= 70)  return "high";
        if (pct >= 40)  return "mid";
        return "low";
      }
      function pctTextClass(pct) {
        if (pct == null) return "";
        if (pct >= 100) return "over";
        if (pct >= 95)  return "complete";
        if (pct >= 70)  return "high";
        if (pct >= 40)  return "mid";
        return "low";
      }

      function renderProductKpis(by_product) {
        const section = $("#prod-section"), target = $("#prod-kpis");
        if (!by_product || !by_product.length) { section.style.display = "none"; target.innerHTML = ""; return; }
        section.style.display = "block";
        target.classList.add("prod-cards");
        target.classList.remove("forn-kpis");
        // Ordena: SEMENTES primeiro (Milho/Feijão/Arroz e variantes),
        // depois outros produtos. Dentro de cada grupo: por % ascendente
        // (mais atrasados primeiro), depois por meta desc.
        const isSementesProduct = (name) =>
          /^(Milho|Feij[aã]o|Arroz)/i.test(String(name || ""));
        const sortedProds = [...by_product].sort((a, b) => {
          const aSem = isSementesProduct(a.product) ? 0 : 1;
          const bSem = isSementesProduct(b.product) ? 0 : 1;
          if (aSem !== bSem) return aSem - bSem;
          const aPct = a.has_meta_any && a.meta_qty > 0 ? a.meta_pct : 999;
          const bPct = b.has_meta_any && b.meta_qty > 0 ? b.meta_pct : 999;
          if (aPct !== bPct) return aPct - bPct;
          return (b.meta_qty || b.forn_qty) - (a.meta_qty || a.forn_qty);
        });
        target.innerHTML = sortedProds.map((p) => {
          const isSaco = p.is_saco;
          const hasMeta = p.has_meta_any && p.meta_qty > 0;
          const unit = isSaco ? "un" : "kg";
          const cardCls = hasMeta ? pctCardClass(p.meta_pct) : "";
          const barWidth = hasMeta ? Math.min(100, p.meta_pct) : 0;
          const barCls = pctBarClass(p.meta_pct);

          const fornDisplay = isSaco ? fmtNum(p.forn_qty) : fmtNum(p.forn_qty);
          const metaDisplay = hasMeta ? fmtNum(p.meta_qty) : "—";
          const pendDisplay = hasMeta ? fmtNum(p.meta_pendente) : "—";

          // Fornecedores deste produto — só mostra se há pendente real
          let suppsHtml = "";
          if (hasMeta && p.meta_pendente > 0 && p.suppliers && p.suppliers.length > 0) {
            const rows = p.suppliers.map((s) => {
              const sPct = s.meta_pct;
              const sQty = `${fmtNum(s.forn_qty)}<span class="unit" style="font-size:.6rem;color:#94a3b8;margin-left:2px">${unit}</span>`;
              const sMeta = s.has_meta && s.meta_qty != null
                ? ` <span style="color:#94a3b8">/ ${fmtNum(s.meta_qty)}${unit}</span>` : "";
              return `<div class="supp-row">
                <span class="sname ${s.is_ghost ? "ghost" : ""}">${esc(s.name)}</span>
                <span class="sqty">${sQty}${sMeta}</span>
                <span class="spct ${pctTextClass(sPct)}">${sPct == null ? "—" : sPct + "%"}</span>
              </div>`;
            }).join("");
            suppsHtml = `
              <div class="supps-block">
                <div class="supps-title">Fornecedores</div>
                ${rows}
              </div>
            `;
          }

          return `
            <div class="prod-card ${cardCls}">
              <div class="name">${esc(p.product)}${isSaco ? '<span style="font-size:.7rem;font-weight:500;color:#94a3b8"> (em un)</span>' : ''}</div>
              <div class="nums">
                <div><span class="lbl">Meta</span><span class="v">${metaDisplay}</span></div>
                <div><span class="lbl">Recebido</span><span class="v forn">${fornDisplay}</span></div>
                <div><span class="lbl">Pendente</span><span class="v pend">${pendDisplay}</span></div>
              </div>
              <div class="progress-wrap"><div class="${barCls}" style="width:${barWidth}%"></div></div>
              <div class="pct-row">
                <span>${hasMeta ? "Progresso vs Contratado" : "Sem meta"}</span>
                <span class="pct-val">${p.meta_pct == null ? "—" : p.meta_pct + "%"}</span>
              </div>
              ${suppsHtml}
            </div>
          `;
        }).join("");
      }

      function pctBar(pct) {
        if (pct == null) return `<span style="color:#94a3b8">—</span>`;
        const cls = pctClass(pct);
        return `<span class="pct-bar">
          <span class="bar"><div class="${cls}" style="width:${Math.min(100, pct)}%"></div></span>
          <span>${pct}%</span>
        </span>`;
      }

      function renderSuppliers(suppliers) {
        const wrap = $("#suppliers-wrap");
        if (!suppliers.length) {
          wrap.innerHTML = `<div class="loading">Sem fornecedores no período.</div>`;
          return;
        }
        wrap.innerHTML = suppliers.map((s, idx) => {
          // Tabela por produto — CRIADO ignorado nesta página (decisão UNOPS:
          // só conta o que efectivamente saiu — TRA+FIN).
          const rows = s.by_product.map((p) => {
            const noMeta = !p.has_meta;
            const isOver = p.has_meta && p.meta_pct >= 100;
            const isSaco = p.is_saco;
            const unit = p.display_unit;
            const meta = p.meta_qty == null
              ? '<span style="color:#94a3b8">—</span>'
              : `${fmtNum(p.meta_qty)}<span class="unit">${unit}</span>`;
            const pend = p.meta_pendente == null
              ? '<span style="color:#94a3b8">—</span>'
              : `${fmtNum(p.meta_pendente)}<span class="unit">${unit}</span>`;
            let cls = "";
            if (isSaco) cls = "is-saco-row";
            else if (noMeta) cls = "no-meta-row";
            return `
              <tr class="${cls}">
                <td>${esc(p.product)} ${isSaco ? '<span class="unit">(em un)</span>' : ''}</td>
                <td class="num qty-meta">${meta}</td>
                <td class="num ${isOver ? 'qty-over' : 'qty-forn'}">${fmtNum(p.forn_qty)}<span class="unit">${unit}</span></td>
                <td class="num qty-pend">${pend}</td>
                <td class="num">${pctBar(p.meta_pct)}</td>
                <td class="num" style="color:#94a3b8">${p.forn_count}</td>
              </tr>
            `;
          }).join("");

          // Classe do card baseada na % global
          let cardCls = "";
          if (s.is_ghost) cardCls = "ghost";
          else if (!s.has_meta) cardCls = "no-meta";
          else if (s.meta_pct >= 100) cardCls = "over";
          else if (s.meta_pct >= 95)  cardCls = "complete";
          else if (s.meta_pct >= 70)  cardCls = "high";
          else if (s.meta_pct >= 40)  cardCls = "mid";
          else                         cardCls = "low";

          const acctChip = s.account_number ? `<span class="acct">#${esc(s.account_number)}</span>` : "";
          const noMetaTag = !s.has_meta ? `<span class="no-meta-tag">sem meta</span>` : "";
          const ghostTag  = s.is_ghost  ? `<span class="ghost-tag">ainda sem entregas</span>` : "";
          const origin = (s.origins[0] || "").trim();

          // Meta header — se for saco-only mostra em un, senão em kg
          let metaTxt, recbTxt, pendTxt, metaUnitLbl;
          const isSacoOnly = s.has_meta && s.meta_total_kg === 0 && (s.meta_total_un || 0) > 0;
          if (isSacoOnly) {
            metaTxt = fmtNum(s.meta_total_un);
            recbTxt = fmtNum(s.forn_qty_un);
            pendTxt = fmtNum(s.meta_pendente_total_un || 0);
            metaUnitLbl = "un";
          } else if (s.has_meta) {
            metaTxt = fmtNum(s.meta_total_kg);
            recbTxt = fmtNum(s.forn_kg);
            pendTxt = fmtNum(s.meta_pendente_total_kg);
            metaUnitLbl = "kg";
          } else {
            metaTxt = "—"; recbTxt = fmtNum(s.forn_kg); pendTxt = "—"; metaUnitLbl = "kg";
          }
          const pctTxt = s.has_meta ? `${s.meta_pct}% recebido` : "sem meta";

          return `
            <article class="sup-card ${cardCls}" data-idx="${idx}">
              <header class="sup-head">
                <div class="name">
                  ${esc(s.canonical_name)}${acctChip}${noMetaTag}${ghostTag}
                  ${origin ? `<span class="origin">${esc(origin)}</span>` : ""}
                </div>
                <div class="metric meta">
                  <div class="lbl">Meta</div>
                  <div class="qty">${metaTxt}<span class="unit" style="font-size:.7rem;font-weight:500;color:#94a3b8"> ${metaUnitLbl}</span></div>
                  <div class="sub">${s.meta_match_key ? '['+esc(s.meta_match_key)+']' : '—'}</div>
                </div>
                <div class="metric forn">
                  <div class="lbl">Recebido</div>
                  <div class="qty">${recbTxt}<span class="unit" style="font-size:.7rem;font-weight:500;color:#94a3b8"> ${metaUnitLbl}</span></div>
                  <div class="sub">${s.count_forn} svc${!isSacoOnly && s.forn_qty_un>0 ? ' · '+fmtNum(s.forn_qty_un)+' un' : ''}</div>
                </div>
                <div>
                  <div class="metric pend" style="margin-bottom:.2rem">
                    <div class="lbl">Pendente</div>
                    <div class="qty">${pendTxt}<span class="unit" style="font-size:.7rem;font-weight:500;color:#94a3b8"> ${metaUnitLbl}</span></div>
                  </div>
                  ${s.has_meta ? `<div class="progress"><div class="${pctClass(s.meta_pct)}" style="width:${Math.min(100, s.meta_pct)}%"></div></div>` : ''}
                  <div class="pct">${pctTxt}</div>
                </div>
              </header>
              <div class="sup-body">
                <table class="sku-tbl">
                  <thead><tr>
                    <th>Produto</th>
                    <th class="num">Meta</th>
                    <th class="num">Recebido</th>
                    <th class="num">Pendente (vs meta)</th>
                    <th class="num">% Recebido</th>
                    <th class="num">ADSNs</th>
                  </tr></thead>
                  <tbody>${rows}</tbody>
                </table>
              </div>
            </article>
          `;
        }).join("");
        $$("#suppliers-wrap .sup-head").forEach((h) => {
          h.addEventListener("click", () => h.closest(".sup-card")?.classList.toggle("open"));
        });
      }

      async function load(forceFresh = false) {
        const from = $("#f-from").value, to = $("#f-to").value;
        const params = new URLSearchParams({ fromDate: from, toDate: to });
        if (forceFresh) params.set("noCache", "1");
        $("#suppliers-wrap").innerHTML = `<div class="loading">${forceFresh ? "A buscar dados frescos (~30-60s)…" : "A carregar…"}</div>`;
        $("#prod-section").style.display = "none";
        $("#cache-info").textContent = "· a carregar…";
        $("#cache-info").className = "cache-info loading";
        const t0 = Date.now();
        try {
          const data = await fetchJSON(`/api/admin/adicional/fornecido?${params}`);
          setCacheInfo(data.cache);
          renderProductKpis(data.totals.by_product || []);
          renderSuppliers(data.suppliers);
          const dt = ((Date.now() - t0) / 1000).toFixed(1);
          const src = data.cache?.from_cache ? "(cache)" : "(fresh)";
          if (toast) toast(`${data.suppliers.length} fornecedores · ${data.totals.meta_pct_global || "?"}% da meta ${src} ${dt}s`, { kind: "ok" });
        } catch (e) {
          $("#suppliers-wrap").innerHTML = `<div class="error">Erro: ${esc(e.message)}</div>`;
          $("#cache-info").textContent = "";
          if (toast) toast("Erro: " + e.message, { kind: "err" });
        }
      }

      $("#btn-load").addEventListener("click", () => load(false));
      $("#btn-force").addEventListener("click", () => load(true));
      $("#btn-expand-all").addEventListener("click", () => {
        const cards = $$("#suppliers-wrap .sup-card");
        const allOpen = cards.every((c) => c.classList.contains("open"));
        cards.forEach((c) => c.classList.toggle("open", !allOpen));
        $("#btn-expand-all").textContent = allOpen ? "Expandir tudo" : "Recolher tudo";
      });
      $("#btn-preset-30").addEventListener("click", () => {
        const d = new Date(today); d.setDate(d.getDate() - 30);
        $("#f-from").value = ymd(d);
        load();
      });
      $("#btn-preset-60").addEventListener("click", () => {
        const d = new Date(today); d.setDate(d.getDate() - 60);
        $("#f-from").value = ymd(d);
        load();
      });

      AdminUI.renderLayout("fornecido");
      load();
    })();
  </script>
</body>
</html>
