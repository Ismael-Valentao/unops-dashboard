<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AQI Operacoes - PO</title>
<link rel="stylesheet" href="/static/admin.css">
</head>
<body class="admin-body">
<div id="layout"></div>
<main class="admin-main">
  <header class="admin-header">
    <h1 id="po-title">Purchase Order</h1>
    <div style="display:flex;gap:.5rem">
      <a href="/admin/purchase-orders" class="btn">← Voltar</a>
      <button id="btn-authorize" class="btn btn-primary">+ Emitir Autorização</button>
    </div>
  </header>

  <section class="admin-section">
    <div id="po-info" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.75rem;margin-bottom:1.25rem"></div>

    <h3 style="margin:1rem 0 .75rem">Itens</h3>
    <div class="tbl-wrap">
      <table class="adm-table">
        <thead><tr>
          <th>Código</th><th>Descrição</th>
          <th style="text-align:right">Planeado</th><th style="text-align:right">Autorizado</th>
          <th style="text-align:right">Recebido</th><th style="text-align:right">Pendente</th>
        </tr></thead>
        <tbody id="items-body"></tbody>
      </table>
    </div>

    <h3 style="margin:1.5rem 0 .75rem">Autorizações emitidas</h3>
    <div class="tbl-wrap">
      <table class="adm-table">
        <thead><tr><th>Nº</th><th>Data</th><th>Matrícula</th><th>Motorista</th><th>Qtd</th><th>Estado</th><th></th></tr></thead>
        <tbody id="auth-body"></tbody>
      </table>
    </div>
  </section>
</main>

<!-- Authorization creation modal -->
<div class="modal-overlay" id="auth-modal" style="display:none">
  <div class="modal-card" style="max-width:720px">
    <div class="modal-head"><h2>Emitir Autorização de Levantamento</h2><button class="modal-x" data-close>&times;</button></div>
    <form id="auth-form" class="modal-form">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:.75rem">
        <label>Transportador<input type="text" name="transporter_name" placeholder="ex: Xai-xai Transportador"></label>
        <label>Data Levantamento<input type="date" name="pickup_date"></label>
        <label>Matrícula *<input type="text" name="truck_plate" required placeholder="MMM-61-11"></label>
        <label>Motorista *<input type="text" name="driver_name" required></label>
        <label>Contacto Motorista<input type="text" name="driver_phone"></label>
        <label>BI Motorista<input type="text" name="driver_id_doc"></label>
      </div>

      <h3 style="margin:1rem 0 .5rem;font-size:1rem">Itens a autorizar</h3>
      <div class="tbl-wrap">
        <table class="adm-table">
          <thead><tr><th>Produto</th><th style="text-align:right">Pendente</th><th style="text-align:right">Qtd a levantar</th></tr></thead>
          <tbody id="auth-items-body"></tbody>
        </table>
      </div>

      <label>Notas<textarea name="notes" rows="2"></textarea></label>
      <button type="submit" class="btn btn-primary">Emitir</button>
    </form>
  </div>
</div>

<script src="/static/admin.js"></script>
<script>
AdminUI.renderLayout("purchase-orders");
const poId = location.pathname.split("/").pop();
let poData = null;

async function load() {
  poData = await AdminUI.fetchJSON("/admin/api/purchase-orders/" + poId);
  document.getElementById("po-title").textContent = "PO " + poData.po_number;
  const info = document.getElementById("po-info");
  info.innerHTML = `
    <div class="info-card"><div class="info-label">Nº PO</div><div class="info-value">${AdminUI.esc(poData.po_number)}</div></div>
    <div class="info-card"><div class="info-label">Data</div><div class="info-value">${poData.po_date ? AdminUI.esc(poData.po_date.slice(0,10)) : "—"}</div></div>
    <div class="info-card"><div class="info-label">Fornecedor</div><div class="info-value">${AdminUI.esc(poData.supplier_name || "—")}</div></div>
    <div class="info-card"><div class="info-label">NUIT</div><div class="info-value">${AdminUI.esc(poData.supplier_nuit || "—")}</div></div>
    <div class="info-card"><div class="info-label">Projecto</div><div class="info-value">${AdminUI.esc(poData.projecto || "—")}</div></div>
    <div class="info-card"><div class="info-label">Estado</div><div class="info-value">${AdminUI.statusBadge(poData.status)}</div></div>
  `;

  document.getElementById("items-body").innerHTML = poData.items.map((it) => {
    const pending = Number(it.qty) - Number(it.qty_received);
    return `<tr>
      <td><code>${AdminUI.esc(it.product_code || "")}</code></td>
      <td>${AdminUI.esc(it.product_name)}</td>
      <td style="text-align:right">${AdminUI.fmt(it.qty)} ${it.unit}</td>
      <td style="text-align:right">${AdminUI.fmt(it.qty_authorized)}</td>
      <td style="text-align:right;color:#16a34a;font-weight:600">${AdminUI.fmt(it.qty_received)}</td>
      <td style="text-align:right;color:${pending > 0 ? "#d97706" : "#64748b"};font-weight:600">${AdminUI.fmt(pending)}</td>
    </tr>`;
  }).join("") || '<tr><td colspan="6" class="empty">Sem itens</td></tr>';

  // Load authorizations for this PO
  const auths = await AdminUI.fetchJSON("/admin/api/authorizations?po_id=" + poId);
  document.getElementById("auth-body").innerHTML = auths.map((a) =>
    `<tr>
      <td><a href="/admin/authorizations/${a.id}"><strong>${AdminUI.esc(a.auth_number)}</strong></a></td>
      <td>${AdminUI.fmtDate(a.issued_at)}</td>
      <td>${AdminUI.esc(a.truck_plate)}</td>
      <td>${AdminUI.esc(a.driver_name)}</td>
      <td style="text-align:right">${AdminUI.fmt(a.total_qty)}</td>
      <td>${AdminUI.statusBadge(a.status)}</td>
      <td><a class="btn btn-sm" href="/admin/authorizations/${a.id}">Ver</a></td>
    </tr>`
  ).join("") || '<tr><td colspan="7" class="empty">Ainda sem autorizações</td></tr>';
}

document.getElementById("btn-authorize").addEventListener("click", () => {
  const body = document.getElementById("auth-items-body");
  body.innerHTML = poData.items.map((it) => {
    const pending = (Number(it.qty) - Number(it.qty_authorized)).toFixed(2);
    if (pending <= 0) return "";
    return `<tr data-po-item-id="${it.id}">
      <td>${AdminUI.esc(it.product_name)}</td>
      <td style="text-align:right">${AdminUI.fmt(pending)} ${it.unit}</td>
      <td><input type="number" min="0" step="0.1" max="${pending}" value="0" data-qty style="width:120px;text-align:right;padding:.4rem;border:1px solid #cbd5e1;border-radius:4px"></td>
    </tr>`;
  }).filter(Boolean).join("") || '<tr><td colspan="3" class="empty">Sem itens pendentes</td></tr>';
  document.getElementById("auth-modal").style.display = "flex";
});

document.getElementById("auth-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = e.target;
  const items = [];
  document.querySelectorAll("#auth-items-body tr[data-po-item-id]").forEach((tr) => {
    const qty = Number(tr.querySelector("[data-qty]").value) || 0;
    if (qty > 0) {
      const poItem = poData.items.find((x) => x.id == tr.dataset.poItemId);
      items.push({
        po_item_id: Number(tr.dataset.poItemId),
        product_id: poItem.product_id,
        product_name: poItem.product_name,
        qty_to_pickup: qty,
        unit: poItem.unit,
      });
    }
  });
  if (!items.length) { alert("Indica pelo menos uma quantidade"); return; }

  try {
    const r = await AdminUI.fetchJSON("/admin/api/authorizations", {
      method: "POST",
      body: {
        po_id: Number(poId),
        transporter_name: f.transporter_name.value,
        truck_plate: f.truck_plate.value,
        driver_name: f.driver_name.value,
        driver_phone: f.driver_phone.value,
        driver_id_doc: f.driver_id_doc.value,
        pickup_date: f.pickup_date.value || null,
        notes: f.notes.value,
        items,
      },
    });
    alert("✓ Autorização " + r.auth_number + " emitida");
    location.href = "/admin/authorizations/" + r.id;
  } catch (err) { alert("Erro: " + err.message); }
});

document.querySelectorAll("[data-close]").forEach((b) =>
  b.addEventListener("click", () => b.closest(".modal-overlay").style.display = "none")
);

load();
</script>
</body>
</html>
