<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AQI — Serviço de Entrega</title>
  <link rel="stylesheet" href="/static/admin.css">
  <style>
    .svc-hdr{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:1rem;margin-bottom:1rem}
    .svc-hdr h1{margin:0;font-size:1.6rem}
    .svc-meta{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem;margin-bottom:1rem}
    .meta-cell{background:#f8fafc;border-radius:8px;padding:.6rem .85rem}
    .meta-lbl{font-size:.65rem;text-transform:uppercase;color:#64748b;font-weight:700;letter-spacing:.04em}
    .meta-val{font-size:.92rem;font-weight:700;color:#1e293b;margin-top:.15rem}

    .badge{display:inline-block;padding:.22rem .6rem;border-radius:5px;font-size:.75rem;font-weight:700}
    .badge-draft{background:#f1f5f9;color:#475569}
    .badge-in_transit{background:#fef3c7;color:#92400e}
    .badge-delivered{background:#dcfce7;color:#166534}
    .badge-cancelled{background:#fee2e2;color:#991b1b}

    .actions{display:flex;gap:.5rem;flex-wrap:wrap}
    .btn-transit{background:#d97706;color:#fff;border:0}
    .btn-transit:hover{background:#b45309}
    .btn-deliver{background:#16a34a;color:#fff;border:0}
    .btn-deliver:hover{background:#15803d}
    .btn-cancel{background:#fff;color:#dc2626;border:1px solid #dc2626}
    .btn-cancel:hover{background:#fef2f2}
    .btn-print{background:#0f4c75;color:#fff;border:0}

    /* Print mode */
    @media print {
      .no-print, #layout, header.admin-header { display: none !important; }
      .admin-main { padding: 0 !important; max-width: 100% !important; }
      .admin-section { box-shadow: none !important; border: 1px solid #000 !important; }
      body { background: #fff !important; }
    }
    .print-header{display:none}
    @media print { .print-header{display:block;text-align:center;border-bottom:2px solid #000;padding-bottom:.5rem;margin-bottom:.75rem}}
  </style>
</head>
<body class="admin-body">
  <div id="layout" class="no-print"></div>
  <main class="admin-main">
    <header class="admin-header no-print">
      <h1>Serviço de Entrega</h1>
      <span class="admin-sub" id="svc-num">…</span>
    </header>

    <div id="content"></div>
  </main>

  <script src="/static/admin.js"></script>
  <script>
    (function () {
      const { fetchJSON, fmt, fmtDate, esc } = window.AdminUI;
      const STATUS = { draft: "Rascunho", in_transit: "Em Trânsito", delivered: "Entregue", cancelled: "Cancelado" };
      const id = location.pathname.split("/").pop();

      function render(svc) {
        document.title = "AQI — " + svc.service_number;
        document.getElementById("svc-num").textContent = svc.service_number;

        const totalBenef = new Set(svc.items.map((i) => i.extensionist_id)).size;
        const itemsBySku = {};
        svc.items.forEach((i) => {
          if (!itemsBySku[i.sku]) itemsBySku[i.sku] = { name: i.product_name, unit: i.unit, qty: 0, n: 0 };
          itemsBySku[i.sku].qty += Number(i.qty);
          itemsBySku[i.sku].n++;
        });

        const html = `
        <div class="print-header">
          <h1>GUIA DE CARREGAMENTO — ${esc(svc.service_number)}</h1>
          <p>${esc(svc.province)} / ${esc(svc.district)} • Matrícula: ${esc(svc.truck_plate || "—")} • Motorista: ${esc(svc.driver_name || "—")}</p>
        </div>
        <section class="admin-section">
          <div class="svc-hdr">
            <div>
              <h1>${esc(svc.service_number)}</h1>
              <div style="margin-top:.4rem"><span class="badge badge-${esc(svc.status)}">${STATUS[svc.status] || svc.status}</span>
                ${svc.source === "imported" ? '<span class="badge" style="background:#e0e7ff;color:#3730a3;margin-left:.4rem">Importado</span>' : ''}</div>
            </div>
            <div class="actions no-print">
              <button class="btn btn-print" onclick="window.print()">🖨 Imprimir Guia</button>
              ${svc.status === "draft" ? `<button class="btn btn-transit" id="btn-transit">🚛 Pôr em Trânsito</button>` : ""}
              ${(svc.status === "draft" || svc.status === "in_transit") ? `<button class="btn btn-deliver" id="btn-deliver">✓ Marcar Entregue</button>` : ""}
              ${(svc.status === "draft" || svc.status === "in_transit") ? `<button class="btn btn-cancel" id="btn-cancel">✗ Cancelar</button>` : ""}
              <a href="/admin/servicos" class="btn">← Voltar</a>
            </div>
          </div>

          <div class="svc-meta">
            <div class="meta-cell"><div class="meta-lbl">Província / Distrito</div><div class="meta-val">${esc(svc.province)} / ${esc(svc.district)}</div></div>
            <div class="meta-cell"><div class="meta-lbl">Capacidade</div><div class="meta-val">${fmt(svc.truck_capacity_kg)} kg</div></div>
            <div class="meta-cell"><div class="meta-lbl">Total carregado</div><div class="meta-val">${fmt(svc.total_kg)} kg</div></div>
            <div class="meta-cell"><div class="meta-lbl">Beneficiários</div><div class="meta-val">${fmt(totalBenef)} (${fmt(svc.items.length)} linhas)</div></div>
            <div class="meta-cell"><div class="meta-lbl">Matrícula principal</div><div class="meta-val"><code>${esc(svc.truck_plate || "—")}</code></div></div>
            <div class="meta-cell"><div class="meta-lbl">Reboque</div><div class="meta-val"><code>${esc(svc.truck_plate_2 || "—")}</code></div></div>
            <div class="meta-cell"><div class="meta-lbl">Motorista</div><div class="meta-val">${esc(svc.driver_name || "—")} ${svc.driver_phone ? `<small>(${esc(svc.driver_phone)})</small>` : ""}</div></div>
            <div class="meta-cell"><div class="meta-lbl">Origem</div><div class="meta-val">${esc(svc.origem_supplier || "—")}</div></div>
            <div class="meta-cell"><div class="meta-lbl">Criado</div><div class="meta-val">${fmtDate(svc.created_at)}</div></div>
            <div class="meta-cell"><div class="meta-lbl">Em trânsito desde</div><div class="meta-val">${fmtDate(svc.dispatched_at)}</div></div>
            <div class="meta-cell"><div class="meta-lbl">Entregue</div><div class="meta-val">${fmtDate(svc.delivered_at)}</div></div>
            <div class="meta-cell"><div class="meta-lbl">Notas</div><div class="meta-val" style="font-size:.78rem">${esc(svc.notes || "—")}</div></div>
          </div>
        </section>

        <section class="admin-section">
          <h2>Resumo por produto</h2>
          <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.5rem">
            ${Object.entries(itemsBySku).map(([sku, p]) => `
              <div style="background:#f8fafc;padding:.6rem .85rem;border-radius:8px;border-left:3px solid #0f4c75">
                <div style="font-size:.7rem;color:#64748b;text-transform:uppercase">${esc(sku)}</div>
                <div style="font-weight:700">${esc(p.name)}</div>
                <div style="font-size:1.1rem;font-weight:800;color:#0f4c75">${fmt(p.qty)} ${esc(p.unit)}</div>
                <div style="font-size:.7rem;color:#94a3b8">${p.n} linhas</div>
              </div>
            `).join("")}
          </div>
        </section>

        <section class="admin-section">
          <h2>Itens (${svc.items.length})</h2>
          <table class="adm-table" style="font-size:.75rem">
            <thead><tr>
              <th>#</th><th>Extens. ID</th><th>Beneficiário</th><th>Distrito</th>
              <th>Produto</th><th class="num">Qtd</th><th>ADSN</th><th>GTU</th>
              <th class="no-print">Assinatura</th>
            </tr></thead>
            <tbody>
              ${svc.items.map((it, idx) => `<tr>
                <td>${idx + 1}</td>
                <td><code>${esc(it.extensionist_id)}</code></td>
                <td>${esc(it.beneficiary_name)}</td>
                <td>${esc(it.district || "")}</td>
                <td>${esc(it.product_name)}</td>
                <td class="num">${fmt(it.qty)} ${esc(it.unit)}</td>
                <td><code style="font-size:.7rem">${esc(it.external_adsn || "—")}</code></td>
                <td><code style="font-size:.7rem">${esc(it.external_gtu || "—")}</code></td>
                <td class="no-print" style="border-bottom:1px dashed #cbd5e1;width:120px"></td>
              </tr>`).join("")}
            </tbody>
          </table>
        </section>
        `;
        document.getElementById("content").innerHTML = html;

        // Action handlers
        const btnTransit = document.getElementById("btn-transit");
        if (btnTransit) btnTransit.addEventListener("click", async () => {
          if (!confirm(`Pôr em trânsito ${svc.service_number}?`)) return;
          try {
            await fetchJSON(`/admin/api/distribution/services/${id}/in-transit`, { method: "POST", body: {} });
            location.reload();
          } catch (e) { alert("Erro: " + e.message); }
        });
        const btnDeliver = document.getElementById("btn-deliver");
        if (btnDeliver) btnDeliver.addEventListener("click", async () => {
          if (!confirm(`Marcar ${svc.service_number} como ENTREGUE? Esta acção não é reversível.`)) return;
          try {
            await fetchJSON(`/admin/api/distribution/services/${id}/delivered`, { method: "POST", body: {} });
            location.reload();
          } catch (e) { alert("Erro: " + e.message); }
        });
        const btnCancel = document.getElementById("btn-cancel");
        if (btnCancel) btnCancel.addEventListener("click", async () => {
          const reason = prompt(`Motivo do cancelamento de ${svc.service_number}?`);
          if (reason === null) return;
          try {
            await fetchJSON(`/admin/api/distribution/services/${id}/cancel`, { method: "POST", body: { reason } });
            location.reload();
          } catch (e) { alert("Erro: " + e.message); }
        });
      }

      document.addEventListener("DOMContentLoaded", async () => {
        try {
          const svc = await fetchJSON("/admin/api/distribution/services/" + id);
          render(svc);
        } catch (e) {
          document.getElementById("content").innerHTML =
            `<div style="background:#fee2e2;padding:1rem;border-radius:6px;color:#991b1b">Erro: ${e.message}</div>`;
        }
      });
    })();
    AdminUI.renderLayout("servicos");
  </script>
</body>
</html>
