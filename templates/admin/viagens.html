<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AQI — Viagens (Mapa)</title>
  <link rel="stylesheet" href="/static/admin.css">
  <style>
    /* ── Viagens ───────────────────────────────────────────── */
    .via-ctrl {
      display: flex; gap: .5rem; flex-wrap: wrap; align-items: end;
      margin-bottom: 1rem; padding: .85rem 1rem;
      background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px;
    }
    .via-ctrl > div:not(.btn-group) { display: flex; flex-direction: column; }
    .via-ctrl .btn-group { display: flex; gap: .4rem; align-self: flex-end; flex-wrap: wrap; }
    .via-ctrl label {
      font-size: .65rem; text-transform: uppercase; letter-spacing: .04em;
      color: #64748b; font-weight: 700; margin-bottom: .25rem;
    }
    .via-ctrl input, .via-ctrl select {
      padding: .4rem .55rem; border: 1px solid #cbd5e1; border-radius: 6px;
      font-size: .82rem; background: #fff; min-width: 110px;
    }
    .via-ctrl .btn {
      padding: .45rem 1rem; background: #0f4c75; color: #fff; border: 0;
      border-radius: 6px; cursor: pointer; font-size: .82rem; font-weight: 600;
    }
    .via-ctrl .btn:hover { background: #1e6ba8; }
    .via-ctrl .btn-sec { background: #fff; color: #0f4c75; border: 1px solid #cbd5e1; }
    .via-ctrl .btn-sec:hover { background: #f1f5f9; }
    .via-ctrl .btn-ex { background: #15803d; }
    .via-ctrl .btn-ex:hover { background: #166534; }
    /* Indicador de cache no painel de controlo */
    .cache-info {
      font-size: .68rem; color: #94a3b8; align-self: center;
      padding: 0 .35rem; font-variant-numeric: tabular-nums;
    }
    .cache-info.fresh  { color: #15803d; }
    .cache-info.stale  { color: #b45309; }
    .cache-info.loading { color: #2563eb; }

    /* KPIs */
    .via-kpis {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: .5rem; margin-bottom: 1rem;
    }
    .kpi {
      background: #fff; border: 1px solid #e2e8f0; border-radius: 6px;
      padding: .55rem .75rem; border-left: 3px solid #0f4c75;
    }
    .kpi .lbl { font-size: .62rem; text-transform: uppercase;
      letter-spacing: .04em; color: #64748b; font-weight: 700; }
    .kpi .val { font-size: 1.25rem; font-weight: 800; color: #0f172a;
      line-height: 1.1; margin-top: .15rem; font-variant-numeric: tabular-nums; }
    .kpi .sub { font-size: .65rem; color: #94a3b8; margin-top: .15rem; }
    .kpi.green { border-left-color: #16a34a; } .kpi.green .val { color: #15803d; }
    .kpi.amber { border-left-color: #d97706; } .kpi.amber .val { color: #b45309; }
    .kpi.red   { border-left-color: #dc2626; } .kpi.red   .val { color: #b91c1c; }

    /* Lista de viagens */
    .viagens-wrap {
      display: flex; flex-direction: column; gap: .6rem;
      max-height: calc(100vh - 280px); overflow: auto;
    }

    .viagem {
      background: #fff; border: 1px solid #e2e8f0; border-radius: 8px;
      overflow: hidden;
      flex: 0 0 auto;
      transition: box-shadow .15s ease, border-color .15s ease;
    }
    .viagem:hover { box-shadow: 0 2px 8px rgba(15,23,42,.08); border-color: #cbd5e1; }
    .viagem.open  { box-shadow: 0 4px 12px rgba(15,23,42,.10); border-color: #93c5fd; }

    /* Header CALMO — fundo branco, hierarquia clara, ponto colorido para status */
    .viagem-head {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: .9rem; align-items: center;
      padding: .8rem 1rem 0.8rem 1.15rem; cursor: pointer; user-select: none;
      position: relative;
    }
    /* Faixa colorida fina à esquerda indica status */
    .viagem-head::before {
      content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    }
    .viagem.s-entregue .viagem-head::before { background: #16a34a; }
    .viagem.s-transito .viagem-head::before { background: #f59e0b; }
    .viagem.s-parcial  .viagem-head::before { background: #8b5cf6; }
    .viagem.s-criado   .viagem-head::before { background: #94a3b8; }

    .viagem-head .titulo-main {
      font-size: 1rem; font-weight: 700; color: #0f172a; letter-spacing: -.01em;
      display: flex; align-items: baseline; flex-wrap: wrap; gap: .35rem;
    }
    .viagem-head .titulo-main .origem-name {
      font-size: .85rem; color: #64748b; font-weight: 500;
    }
    .viagem-head .titulo-main .arrow {
      color: #cbd5e1; font-weight: 400;
    }
    .viagem-head .titulo-sub {
      font-size: .78rem; color: #64748b; margin-top: .15rem;
      font-variant-numeric: tabular-nums;
    }
    /* Pills com produtos carregados (ex: Milho 18.5t · Feijão 4t) */
    .viagem-head .produtos {
      display: flex; flex-wrap: wrap; gap: .25rem; margin-top: .25rem;
    }
    .viagem-head .produtos .prod-pill {
      display: inline-flex; align-items: baseline; gap: .25rem;
      font-size: .68rem; padding: .12rem .42rem; border-radius: 99px;
      background: #f1f5f9; color: #334155; border: 1px solid #e2e8f0;
      font-variant-numeric: tabular-nums; white-space: nowrap;
    }
    .viagem-head .produtos .prod-pill strong {
      font-weight: 700; color: #0f172a;
    }
    .viagem-head .produtos .prod-pill .qty {
      color: #64748b; font-weight: 500;
    }
    /* Quando viagem mistura ≥2 produtos, destaca discretamente */
    .viagem.multi-product .viagem-head .produtos .prod-pill {
      background: #fef3c7; border-color: #fde68a;
    }
    .viagem-head .ton-wrap {
      display: flex; align-items: center; gap: .65rem;
    }
    /* Botão refresh por ADSE (ícone discreto canto top-right) */
    .viagem-head .btn-refresh {
      background: transparent; border: 1px solid #e2e8f0; border-radius: 6px;
      width: 28px; height: 28px; display: flex; align-items: center;
      justify-content: center; cursor: pointer; color: #64748b;
      transition: background .12s, color .12s, border-color .12s;
      flex-shrink: 0; font-size: .9rem; padding: 0;
    }
    .viagem-head .btn-refresh:hover { background: #dbeafe; color: #1e40af; border-color: #93c5fd; }
    .viagem-head .btn-refresh.spinning { pointer-events: none; opacity: .7; }
    .viagem-head .btn-refresh.spinning svg { animation: spin 1s linear infinite; }
    .viagem.flash-updated { animation: flash 1.4s ease-out; }
    @keyframes spin  { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes flash {
      0%   { box-shadow: 0 0 0 0 rgba(34,197,94,.5); background: #f0fdf4; }
      100% { box-shadow: 0 0 0 8px rgba(34,197,94,0); background: #fff; }
    }
    .viagem-head .ton {
      font-size: 1.2rem; font-weight: 700; color: #0f172a;
      font-variant-numeric: tabular-nums; line-height: 1;
    }
    .viagem-head .ton .u { font-size: .75rem; color: #94a3b8; font-weight: 500; margin-left: 2px; }
    .viagem-head .ton-sub {
      font-size: .68rem; color: #94a3b8; margin-top: .2rem; text-align: right;
    }
    .viagem-head .status-dot {
      width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
    }
    .viagem.s-entregue .status-dot { background: #16a34a; }
    .viagem.s-transito .status-dot { background: #f59e0b; }
    .viagem.s-parcial  .status-dot { background: #8b5cf6; }
    .viagem.s-criado   .status-dot { background: #94a3b8; }

    /* Meta só aparece quando expandido */
    .viagem-meta {
      background: #f8fafc; padding: .65rem 1rem;
      border-top: 1px solid #e2e8f0; border-bottom: 1px solid #e2e8f0;
      font-size: .76rem; color: #475569;
      display: none;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: .6rem 1.2rem;
    }
    .viagem.open .viagem-meta { display: grid; }
    .viagem-meta .meta-cell { display: flex; flex-direction: column; }
    .viagem-meta .meta-lbl {
      font-size: .62rem; text-transform: uppercase; letter-spacing: .05em;
      color: #94a3b8; font-weight: 700; margin-bottom: .15rem;
    }
    .viagem-meta strong { color: #0f172a; font-weight: 600; }
    .viagem-meta .adse-code {
      font-family: ui-monospace, monospace; font-size: .72rem; color: #475569;
      background: #fff; border: 1px solid #e2e8f0; padding: .1rem .35rem;
      border-radius: 4px; display: inline-block; max-width: max-content;
    }

    .viagem-body { display: none; padding: 0; }
    .viagem.open .viagem-body { display: block; }

    .items-tbl {
      width: 100%; border-collapse: collapse; font-size: .76rem;
    }
    .items-tbl thead { background: #f1f5f9; color: #475569; }
    .items-tbl thead th {
      padding: .4rem .55rem; text-align: left; font-weight: 700;
      font-size: .67rem; text-transform: uppercase; letter-spacing: .03em;
      border-bottom: 1px solid #cbd5e1;
    }
    .items-tbl thead th.num { text-align: right; }
    .items-tbl tbody td {
      padding: .4rem .55rem; border-bottom: 1px solid #f1f5f9;
    }
    .items-tbl tbody tr:hover { background: #f8fafc; }
    .items-tbl td.num { text-align: right; font-variant-numeric: tabular-nums; }
    .items-tbl td.mono { font-family: ui-monospace, monospace; font-size: .68rem; color: #475569; }
    .items-tbl tfoot td {
      background: #e0f2fe; font-weight: 700; padding: .4rem .55rem;
      border-top: 2px solid #0f4c75;
    }
    .status-pill {
      display: inline-block; padding: .05rem .4rem; border-radius: 99px;
      font-size: .65rem; font-weight: 700;
    }
    .status-pill.FINALIZADO { background: #dcfce7; color: #166534; }
    .status-pill.TRANSITO   { background: #fef9c3; color: #854d0e; }
    .status-pill.CRIADO     { background: #f1f5f9; color: #475569; }

    /* Indicador "Sistema" (ADICIONAL vs UNOPS+ADICIONAL) */
    .sys-pill {
      display: inline-block; padding: .05rem .4rem; border-radius: 99px;
      font-size: .62rem; font-weight: 700; letter-spacing: .03em;
      white-space: nowrap;
    }
    .sys-pill.both { background: #dcfce7; color: #166534; }
    .sys-pill.only { background: #fef3c7; color: #92400e; }
    /* ── Modal de anexos (lightbox) ─────────────────────────── */
    .attach-modal {
      position: fixed; inset: 0; z-index: 200;
      display: none; align-items: center; justify-content: center;
    }
    .attach-modal.open { display: flex; }
    .attach-modal-bg {
      position: absolute; inset: 0;
      background: rgba(15,23,42,.85);
      backdrop-filter: blur(4px);
    }
    .attach-modal-content {
      position: relative; z-index: 1;
      max-width: 95vw; max-height: 95vh;
      display: flex; flex-direction: column;
      gap: .5rem;
    }
    .attach-modal-img-wrap {
      position: relative;
      background: #1e293b; border-radius: 8px;
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      min-height: 200px; max-height: 80vh;
    }
    .attach-modal-img {
      max-width: 100%; max-height: 80vh;
      object-fit: contain; display: block;
    }
    .attach-modal-loading {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      color: #94a3b8; font-style: italic;
    }
    .attach-modal-error {
      padding: 2rem; text-align: center; color: #fca5a5;
      background: rgba(127,29,29,.3); border-radius: 6px;
    }
    .attach-modal-btn {
      position: absolute; top: 50%; transform: translateY(-50%);
      background: rgba(255,255,255,.15); border: 0;
      width: 44px; height: 44px; border-radius: 50%;
      color: #fff; cursor: pointer; font-size: 1.4rem;
      display: flex; align-items: center; justify-content: center;
      transition: background .12s;
    }
    .attach-modal-btn:hover { background: rgba(255,255,255,.3); }
    .attach-modal-prev { left: .75rem; }
    .attach-modal-next { right: .75rem; }
    .attach-modal-close {
      position: absolute; top: .75rem; right: .75rem;
      background: rgba(0,0,0,.5); border: 0;
      width: 36px; height: 36px; border-radius: 50%;
      color: #fff; cursor: pointer; font-size: 1.4rem; line-height: 1;
      z-index: 2;
    }
    .attach-modal-close:hover { background: rgba(0,0,0,.8); }
    .attach-modal-counter {
      position: absolute; top: .75rem; left: .75rem;
      background: rgba(0,0,0,.5); color: #fff;
      padding: .3rem .65rem; border-radius: 99px;
      font-size: .75rem; font-weight: 600;
      z-index: 2;
    }
    .attach-modal-footer {
      background: #fff; border-radius: 8px;
      padding: .55rem .9rem;
      display: flex; align-items: center; justify-content: space-between;
      gap: 1rem;
    }
    .attach-modal-label {
      font-size: .85rem; font-weight: 600; color: #0f172a;
    }
    .attach-modal-label .kind-pill {
      display: inline-block; font-size: .65rem;
      padding: .1rem .45rem; border-radius: 99px;
      margin-right: .4rem; font-weight: 700;
    }
    .attach-modal-label .kind-pill.guia { background: #dbeafe; color: #1e40af; }
    .attach-modal-label .kind-pill.sig  { background: #d1fae5; color: #065f46; }
    .attach-modal-open {
      font-size: .75rem; color: #0f4c75; text-decoration: none;
      font-weight: 600;
      padding: .35rem .75rem; border: 1px solid #cbd5e1; border-radius: 5px;
      background: #f8fafc;
    }
    .attach-modal-open:hover { background: #dbeafe; border-color: #93c5fd; }

    /* Ícones de anexos (guias + assinatura) ao lado do estado UNOPS */
    .attach-row {
      display: inline-flex; gap: .25rem; margin-left: .35rem;
      vertical-align: middle;
    }
    .attach-icon {
      display: inline-flex; align-items: center; justify-content: center;
      width: 22px; height: 22px; border-radius: 4px;
      background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0;
      font-size: .78rem; text-decoration: none; cursor: pointer;
      transition: background .12s, color .12s, transform .08s;
    }
    .attach-icon:hover { background: #dbeafe; color: #1e40af; transform: translateY(-1px); }
    .attach-icon.sig    { background: #ecfdf5; color: #047857; border-color: #d1fae5; }
    .attach-icon.sig:hover { background: #d1fae5; color: #065f46; }
    /* Mini-resumo no cabeçalho da viagem: ex "3/4 UNOPS" */
    .unops-mini {
      display: inline-flex; align-items: center; gap: .25rem;
      font-size: .68rem; font-weight: 600;
      padding: .12rem .4rem; border-radius: 4px;
      margin-left: .35rem; vertical-align: middle;
    }
    .unops-mini.full { background: #dcfce7; color: #166534; }
    .unops-mini.part { background: #fef3c7; color: #92400e; }
    .unops-mini.none { background: #fee2e2; color: #991b1b; }

    .loading { padding: 2.5rem; text-align: center; color: #94a3b8; font-style: italic; }
    .error { padding: 1rem; background: #fef2f2; border: 1px solid #fecaca; border-radius: 6px; color: #b91c1c; }

    @media print {
      .via-ctrl, .via-kpis, .admin-sidebar, .admin-header { display: none !important; }
      .viagem-body { display: block !important; }
      .viagem { break-inside: avoid; }
    }
  </style>
</head>
<body class="admin-body">
  <div id="layout"></div>
  <main class="admin-main">
    <header class="admin-header">
      <h1>Viagens (Mapa)</h1>
      <span class="admin-sub">1 viagem = 1 ADSE (carga do camião) · formato do mapa Excel original</span>
    </header>

    <section class="admin-section">

      <!-- Controlos -->
      <div class="via-ctrl">
        <div><label>De</label><input type="date" id="f-from"></div>
        <div><label>Até</label><input type="date" id="f-to"></div>
        <div>
          <label>Status</label>
          <select id="f-status">
            <option value="">Todos (TRA + FIN)</option>
            <option value="ENTREGUE">Entregue</option>
            <option value="Em trânsito">Em trânsito</option>
            <option value="Parcial">Parcial</option>
          </select>
        </div>
        <div><label>Província</label><input type="text" id="f-province" placeholder="Ex: Gaza"></div>
        <div><label>Distrito</label><input type="text" id="f-district" placeholder="Ex: Chibuto"></div>
        <div><label>Fornecedor</label><input type="text" id="f-supplier" placeholder="Ex: SEEDCO"></div>
        <div><label>Batedor</label><input type="text" id="f-batedor" placeholder="Nome ou email"></div>
        <div>
          <label>Produto</label>
          <select id="f-product">
            <option value="">Todos</option>
          </select>
        </div>
        <div>
          <label>UNOPS</label>
          <select id="f-unops">
            <option value="">Todos</option>
            <option value="missing">Só com ADSNs fora do UNOPS</option>
            <option value="none">Sem nenhum no UNOPS</option>
            <option value="full">100% no UNOPS</option>
          </select>
        </div>
        <div class="btn-group">
          <button class="btn" id="btn-load">Carregar</button>
          <button class="btn btn-sec" id="btn-force" title="Forçar refresh (ignora cache 5min)">↻ Fresh</button>
          <button class="btn btn-sec" id="btn-clear">Limpar</button>
          <button class="btn btn-sec" id="btn-expand-all">Expandir tudo</button>
          <button class="btn btn-ex" id="btn-export" disabled>Excel (mapa)</button>
          <span id="cache-info" class="cache-info"></span>
        </div>
      </div>

      <!-- KPIs -->
      <div class="via-kpis" id="kpis"></div>

      <!-- Lista de viagens -->
      <div id="viagens" class="viagens-wrap">
        <div class="loading">Carregue para começar.</div>
      </div>
    </section>
  </main>

  <!-- Modal lightbox para anexos UNOPS (imagens) -->
  <div class="attach-modal" id="attach-modal" role="dialog" aria-modal="true">
    <div class="attach-modal-bg" id="attach-modal-bg"></div>
    <div class="attach-modal-content">
      <div class="attach-modal-img-wrap">
        <span class="attach-modal-counter" id="attach-modal-counter">1 de 1</span>
        <button class="attach-modal-close" id="attach-modal-close" title="Fechar (Esc)">×</button>
        <button class="attach-modal-btn attach-modal-prev" id="attach-modal-prev" title="Anterior (←)">‹</button>
        <button class="attach-modal-btn attach-modal-next" id="attach-modal-next" title="Próximo (→)">›</button>
        <img class="attach-modal-img" id="attach-modal-img" alt="Anexo">
      </div>
      <div class="attach-modal-footer">
        <span class="attach-modal-label" id="attach-modal-label"></span>
        <a class="attach-modal-open" id="attach-modal-open" target="_blank" rel="noopener">Abrir original ↗</a>
      </div>
    </div>
  </div>

  <script src="/static/admin.js"></script>
  <script>
    (function () {
      const { fetchJSON, fmt, esc, toast } = window.AdminUI;
      const $ = (s) => document.querySelector(s);
      const $$ = (s) => Array.from(document.querySelectorAll(s));

      function ymd(d) {
        return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
      }
      const today = new Date(); today.setHours(0,0,0,0);
      const d30 = new Date(today); d30.setDate(d30.getDate() - 30);
      $("#f-from").value = ymd(d30);
      $("#f-to").value   = ymd(today);

      let lastData = null;

      // ── Modal de anexos (lightbox) ─────────────────────────────
      // Map: adsn → array de { url, label, kind }
      const attachmentsByAdsn = new Map();
      let modalCurrentList = [], modalCurrentIdx = 0;

      // Converte URL de Google Drive em URL de imagem embedável.
      // Aceita formatos:
      //   https://drive.google.com/open?id=XYZ
      //   https://drive.google.com/file/d/XYZ/view
      //   https://docs.google.com/uc?id=XYZ
      // Se não bater, devolve a URL original (pode já ser uma imagem directa).
      function imageEmbedUrl(url) {
        const s = String(url || "");
        let m = s.match(/\/file\/d\/([^/?#]+)/);
        if (!m) m = s.match(/[?&]id=([^&]+)/);
        if (m) return `https://drive.google.com/thumbnail?id=${m[1]}&sz=w2000`;
        return s;
      }

      function openAttachmentModal(adsn, idx) {
        const list = attachmentsByAdsn.get(adsn);
        if (!list || !list.length) return;
        modalCurrentList = list;
        modalCurrentIdx = Math.max(0, Math.min(idx | 0, list.length - 1));
        renderModalSlide();
        document.getElementById("attach-modal").classList.add("open");
        document.body.style.overflow = "hidden";
      }
      function closeAttachmentModal() {
        document.getElementById("attach-modal").classList.remove("open");
        document.body.style.overflow = "";
        // Liberta o src para não manter download em background
        document.getElementById("attach-modal-img").src = "";
      }
      function navAttachment(delta) {
        if (!modalCurrentList.length) return;
        modalCurrentIdx = (modalCurrentIdx + delta + modalCurrentList.length) % modalCurrentList.length;
        renderModalSlide();
      }
      function renderModalSlide() {
        const att = modalCurrentList[modalCurrentIdx];
        const total = modalCurrentList.length;
        const img = document.getElementById("attach-modal-img");
        const label = document.getElementById("attach-modal-label");
        const open = document.getElementById("attach-modal-open");
        const counter = document.getElementById("attach-modal-counter");
        const prev = document.getElementById("attach-modal-prev");
        const next = document.getElementById("attach-modal-next");
        img.src = imageEmbedUrl(att.url);
        img.alt = att.label;
        const kindClass = att.kind === "sig" ? "sig" : "guia";
        const kindLabel = att.kind === "sig" ? "Assinatura" : "Guia";
        label.innerHTML = `<span class="kind-pill ${kindClass}">${kindLabel}</span>${esc(att.label)}`;
        open.href = att.url;
        counter.textContent = `${modalCurrentIdx + 1} de ${total}`;
        prev.style.display = total > 1 ? "" : "none";
        next.style.display = total > 1 ? "" : "none";
      }

      // Wire-up modal (1 vez)
      document.getElementById("attach-modal-bg").addEventListener("click", closeAttachmentModal);
      document.getElementById("attach-modal-close").addEventListener("click", closeAttachmentModal);
      document.getElementById("attach-modal-prev").addEventListener("click", (e) => { e.stopPropagation(); navAttachment(-1); });
      document.getElementById("attach-modal-next").addEventListener("click", (e) => { e.stopPropagation(); navAttachment(1); });
      document.addEventListener("keydown", (e) => {
        if (!document.getElementById("attach-modal").classList.contains("open")) return;
        if (e.key === "Escape")     closeAttachmentModal();
        else if (e.key === "ArrowLeft")  navAttachment(-1);
        else if (e.key === "ArrowRight") navAttachment(1);
      });
      // Delegação: qualquer click em .attach-icon abre o modal
      document.addEventListener("click", (e) => {
        const btn = e.target.closest(".attach-icon");
        if (!btn) return;
        e.stopPropagation();
        e.preventDefault();
        const adsn = btn.dataset.adsn;
        const idx  = Number(btn.dataset.attachIdx || 0);
        if (adsn) openAttachmentModal(adsn, idx);
      }, true);

      function statusClass(s) {
        if (s === "ENTREGUE")       return "s-entregue";
        if (s === "Em trânsito")    return "s-transito";
        if (s === "Parcial")        return "s-parcial";
        return "s-criado";
      }
      function fmtDateShort(iso) {
        if (!iso) return "—";
        const parts = String(iso).split("-");
        if (parts.length !== 3) return iso;
        return parts[2] + "/" + parts[1];
      }

      function renderKpis(summary) {
        const byStatusEntries = Object.entries(summary.by_status || {});
        const entregue  = (summary.by_status?.ENTREGUE) || 0;
        const transito  = (summary.by_status?.["Em trânsito"]) || 0;
        const parcial   = (summary.by_status?.Parcial) || 0;
        const unopsIn    = summary.unops_in || 0;
        const unopsTotal = summary.unops_total || 0;
        const unopsPct  = unopsTotal ? Math.round((unopsIn / unopsTotal) * 100) : 0;
        const unopsClass = unopsPct === 100 ? "green" : (unopsPct === 0 ? "red" : "amber");
        $("#kpis").innerHTML = `
          <div class="kpi">
            <div class="lbl">Viagens</div>
            <div class="val">${fmt(summary.viagens)}</div>
            <div class="sub">${fmt(summary.total_items)} ADSNs · ${fmt(summary.distritos)} distritos</div>
          </div>
          <div class="kpi green">
            <div class="lbl">Total</div>
            <div class="val">${fmt(summary.total_ton)}<span style="font-size:.75rem;color:#64748b"> t</span></div>
            <div class="sub">${fmt(summary.total_kg)} kg</div>
          </div>
          <div class="kpi green">
            <div class="lbl">Entregues</div>
            <div class="val">${fmt(entregue)}</div>
            <div class="sub">100% finalizadas</div>
          </div>
          <div class="kpi amber">
            <div class="lbl">Em Trânsito / Parcial</div>
            <div class="val">${fmt(transito + parcial)}</div>
            <div class="sub">${transito} trânsito · ${parcial} parcial</div>
          </div>
          <div class="kpi ${unopsClass}">
            <div class="lbl">Lançados no UNOPS</div>
            <div class="val">${fmt(unopsIn)}<span style="font-size:.75rem;color:#64748b"> / ${fmt(unopsTotal)}</span></div>
            <div class="sub">${unopsPct}% no sistema UNOPS</div>
          </div>
        `;
      }

      function renderViagens(viagens) {
        if (!viagens.length) {
          $("#viagens").innerHTML = `<div class="loading">Sem viagens para os filtros aplicados.</div>`;
          return;
        }
        $("#viagens").innerHTML = viagens.map((v, idx) => {
          const nUnops = v.items.filter((it) => it.sheet_matched).length;
          const nTotal = v.items.length;
          const unopsClass = nUnops === nTotal ? "full" : (nUnops === 0 ? "none" : "part");
          const unopsTitle = nUnops === nTotal
            ? "Todos os ADSNs já lançados no UNOPS"
            : (nUnops === 0 ? "Nenhum ADSN lançado no UNOPS" : `${nUnops} de ${nTotal} ADSNs já no UNOPS`);
          const items = v.items.map((it) => {
            // Anexos: guias (📎 1/2/3) + assinatura (✍️) — só quando há match UNOPS
            // e há pelo menos 1 URL. Clique abre modal lightbox em vez de nova aba.
            let attachIcons = "";
            if (it.sheet_matched) {
              const links = it.attachments || [];
              const sig   = it.beneficiary_signature || null;
              const list  = [];
              links.forEach((url, i) => list.push({ url, label: `Guia #${i+1}`, kind: "guia" }));
              if (sig) list.push({ url: sig, label: "Assinatura beneficiário", kind: "sig" });
              if (list.length) {
                attachmentsByAdsn.set(it.adsn, list);
                const icons = [];
                list.forEach((att, idx) => {
                  const isGuia = att.kind === "guia";
                  icons.push(`<button type="button" class="attach-icon${isGuia ? "" : " sig"}"
                    data-adsn="${esc(it.adsn)}" data-attach-idx="${idx}"
                    title="${esc(att.label)} — clique para ver">${isGuia ? "📎" : "✍"}</button>`);
                });
                attachIcons = `<span class="attach-row">${icons.join("")}</span>`;
              }
            }
            const sysCell = it.sheet_matched
              ? `<span class="sys-pill both" title="Lançado em ambos os sistemas">UNOPS + ADIC</span>${attachIcons}`
              : `<span class="sys-pill only" title="Falta lançar no sistema UNOPS">Só ADIC</span>`;
            return `
            <tr>
              <td class="mono">${esc(it.adsn || "")}</td>
              <td class="mono">${esc(it.gtu || "")}</td>
              <td>${sysCell}</td>
              <td>${esc(it.ext_name || "")}</td>
              <td>${esc(it.ext_contact || "")}</td>
              <td class="mono">${esc(it.ext_nuit || "")}</td>
              <td>${esc(it.product || "")}</td>
              <td class="num">${fmt(it.volumes || 0)}</td>
              <td class="num">${fmt(Math.round(it.weight_kg || 0))}</td>
              <td class="num"><strong>${fmt(it.weight_ton)}</strong></td>
              <td><span class="status-pill ${esc(it.status)}">${esc(it.status)}</span></td>
            </tr>
          `;
          }).join("");
          // Pills de produtos carregados — sempre visíveis (chama atenção para viagens mistas)
          const productsPills = (v.products || []).map((p) =>
            `<span class="prod-pill"><strong>${esc(p.product)}</strong> <span class="qty">${fmt(p.ton)}t</span></span>`
          ).join("");
          const multiClass = (v.n_products || 0) >= 2 ? " multi-product" : "";
          return `
            <article class="viagem ${statusClass(v.status)}${multiClass}" data-idx="${idx}">
              <header class="viagem-head" title="Click para expandir">
                <div>
                  <div class="titulo-main">
                    ${v.fornecedor ? `<span class="origem-name">${esc(v.fornecedor)}</span><span class="arrow">→</span>` : ""}
                    <span>${esc(v.destino_distrito || "—")}</span>
                  </div>
                  ${productsPills ? `<div class="produtos">${productsPills}</div>` : ""}
                  <div class="titulo-sub">
                    ${esc(v.matricula || "—")}  ·  ${esc(fmtDateShort(v.data_saida))}  ·  ${fmt(v.n_extensionistas)} ext.
                    <span class="unops-mini ${unopsClass}" title="${esc(unopsTitle)}">${nUnops}/${nTotal} UNOPS</span>
                  </div>
                </div>
                <div class="ton-wrap">
                  <div>
                    <div class="ton">${fmt(v.total_ton)}<span class="u">t</span></div>
                    <div class="ton-sub">${esc(v.status)}</div>
                  </div>
                  <div class="status-dot" title="${esc(v.status)}"></div>
                  <button class="btn-refresh" data-adse="${esc(v.adse || '')}" data-date="${esc(v.data_saida || '')}"
                    title="Actualizar apenas esta ADSE (rápido — só procura nesta data)"
                    onclick="event.stopPropagation()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
                  </button>
                </div>
              </header>
              <div class="viagem-meta">
                <div class="meta-cell">
                  <span class="meta-lbl">ADSE</span>
                  <span class="adse-code">${esc(v.adse || "(fallback)")}</span>
                </div>
                <div class="meta-cell">
                  <span class="meta-lbl">Origem · Transportador</span>
                  <span><strong>${esc(v.fornecedor || "—")}</strong> · ${esc(v.transportador || "—")}</span>
                </div>
                <div class="meta-cell">
                  <span class="meta-lbl">Motorista</span>
                  <span><strong>${esc(v.motorista || "—")}</strong></span>
                </div>
                <div class="meta-cell">
                  <span class="meta-lbl">Batedor</span>
                  <span><strong>${esc(v.batedor || "—")}</strong>${v.batedor_contact ? " · " + esc(v.batedor_contact) : ""}</span>
                </div>
                ${v.supervisor_phone ? `<div class="meta-cell">
                  <span class="meta-lbl">Supervisor</span>
                  <span><strong>${esc(v.supervisor_phone)}</strong></span>
                </div>` : ""}
              </div>
              <div class="viagem-body">
                <table class="items-tbl">
                  <thead><tr>
                    <th>Código Serviço</th>
                    <th>GTU/GTS</th>
                    <th>Sistema</th>
                    <th>Nome Extensionista</th>
                    <th>Telf Ext.</th>
                    <th>NUIT</th>
                    <th>Artigo</th>
                    <th class="num">Volumes</th>
                    <th class="num">Peso (kg)</th>
                    <th class="num">Ton</th>
                    <th>Estado</th>
                  </tr></thead>
                  <tbody>${items}</tbody>
                  <tfoot><tr>
                    <td colspan="7" style="text-align:right">TOTAL</td>
                    <td class="num">${fmt(v.total_volumes)}</td>
                    <td class="num">${fmt(Math.round(v.total_kg))}</td>
                    <td class="num">${fmt(v.total_ton)}</td>
                    <td></td>
                  </tr></tfoot>
                </table>
              </div>
            </article>
          `;
        }).join("");

        // Wire click handlers — expand/collapse no header
        $$("#viagens .viagem-head").forEach((h) => {
          h.addEventListener("click", () => {
            const art = h.closest(".viagem");
            if (art) art.classList.toggle("open");
          });
        });
        // Botão refresh por ADSE
        $$("#viagens .btn-refresh").forEach((btn) => {
          btn.addEventListener("click", (ev) => {
            ev.stopPropagation();
            refreshADSE(btn);
          });
        });
      }

      // Refresh: re-fetch APENAS 1 ADSE da API (janela ±2 dias da data da viagem)
      // e substitui in-place em lastData.viagens, depois re-renderiza.
      async function refreshADSE(btn) {
        const adse = btn.dataset.adse;
        const date = btn.dataset.date;
        if (!adse || !date) {
          if (toast) toast("ADSE ou data em falta — refresh impossível", { kind: "err" });
          return;
        }
        btn.classList.add("spinning");
        try {
          const params = new URLSearchParams({ adse, date });
          if ($("#f-status").value === "Em trânsito" || $("#f-status").value === "ENTREGUE") {
            // já filtramos client-side; mas para o refresh, queremos sempre incluir tudo
          }
          const data = await fetchJSON("/api/admin/adicional/viagens/refresh?" + params);
          const fresh = data.viagem;
          // Preserva cam_label/cam_number originais (numeração depende do dataset completo)
          const idx = lastData.viagens.findIndex((v) =>
            String(v.adse || "").trim() === adse
          );
          if (idx >= 0) {
            const prev = lastData.viagens[idx];
            fresh.cam_label  = prev.cam_label;
            fresh.cam_number = prev.cam_number;
            lastData.viagens[idx] = fresh;
          } else {
            // ADSE nova (raríssimo) — apenda
            lastData.viagens.unshift(fresh);
          }
          rerender();
          // Flash visual no card actualizado
          requestAnimationFrame(() => {
            const art = document.querySelector(`#viagens .viagem .btn-refresh[data-adse="${adse}"]`)?.closest(".viagem");
            if (art) {
              art.classList.add("flash-updated");
              setTimeout(() => art.classList.remove("flash-updated"), 1500);
            }
          });
          if (toast) toast(`ADSE ${adse} actualizada (${fresh.status} · ${fresh.total_ton}t)`, { kind: "ok" });
        } catch (e) {
          btn.classList.remove("spinning");
          if (toast) toast("Erro refresh: " + e.message, { kind: "err" });
        }
      }

      function pickFilters() {
        // Server-side: APENAS as datas determinam o universo carregado.
        // Tudo o resto (status, província, distrito, etc.) é filtro client-side
        // em rerender() — instant, sem nova chamada à API.
        const f = {};
        const from = $("#f-from").value;
        const to   = $("#f-to").value;
        if (from) f.fromDate = from;
        if (to)   f.toDate   = to;
        return f;
      }

      // Para o Excel export, mantemos os filtros no URL para reduzir o ficheiro.
      function pickFiltersForExport() {
        const f = pickFilters();
        ["status","province","district","supplier","batedor"].forEach((k) => {
          const v = $("#f-" + k)?.value?.trim();
          if (v) f[k] = v;
        });
        return f;
      }

      // Popula o dropdown de produtos com os produtos distintos da data.
      // Mantém a selecção anterior se ainda válida.
      function populateProductFilter() {
        if (!lastData) return;
        const prev = $("#f-product").value;
        const totals = new Map(); // produto → kg total (para ordenar)
        for (const v of lastData.viagens) {
          for (const p of (v.products || [])) {
            totals.set(p.product, (totals.get(p.product) || 0) + p.kg);
          }
        }
        const opts = [...totals.entries()].sort((a, b) => b[1] - a[1]);
        const sel = $("#f-product");
        sel.innerHTML =
          '<option value="">Todos</option>' +
          opts.map(([p, kg]) =>
            `<option value="${esc(p)}">${esc(p)} (${fmt(Math.round(kg/1000))}t)</option>`
          ).join("");
        // Mantém selecção anterior se ainda existe
        if (prev && opts.some(([p]) => p === prev)) sel.value = prev;
      }

      // Re-renderiza a partir de lastData sem voltar a chamar a API.
      // Aplica TODOS os filtros client-side (instant) + recomputa KPIs.
      function rerender() {
        if (!lastData) return;
        const norm = (s) => String(s || "").toLowerCase();
        const fStatus   = $("#f-status").value;
        const fProvince = $("#f-province").value.trim();
        const fDistrict = $("#f-district").value.trim();
        const fSupplier = $("#f-supplier").value.trim();
        const fBatedor  = $("#f-batedor").value.trim();
        const fProduct  = $("#f-product").value;
        const fUnops    = $("#f-unops").value;

        let viagensRender = lastData.viagens;
        if (fStatus)   viagensRender = viagensRender.filter((v) => v.status === fStatus);
        if (fProvince) viagensRender = viagensRender.filter((v) =>
          norm(v.destino_provincia).includes(norm(fProvince)));
        if (fDistrict) viagensRender = viagensRender.filter((v) =>
          norm(v.destino_distrito).includes(norm(fDistrict)));
        if (fSupplier) viagensRender = viagensRender.filter((v) =>
          norm(v.fornecedor).includes(norm(fSupplier)));
        if (fBatedor)  viagensRender = viagensRender.filter((v) =>
          norm(v.batedor).includes(norm(fBatedor)) ||
          norm(v.batedor_email).includes(norm(fBatedor)));
        if (fProduct) {
          // Viagem é incluída se ALGUM ADSN seu carregou o produto seleccionado
          viagensRender = viagensRender.filter((v) =>
            (v.products || []).some((p) => p.product === fProduct));
        }
        if (fUnops === "missing") {
          viagensRender = viagensRender.filter((v) =>
            v.items.some((it) => !it.sheet_matched));
        } else if (fUnops === "none") {
          viagensRender = viagensRender.filter((v) =>
            v.items.every((it) => !it.sheet_matched));
        } else if (fUnops === "full") {
          viagensRender = viagensRender.filter((v) =>
            v.items.every((it) => it.sheet_matched));
        }
        // KPIs sobre o subset visível
        let unopsIn = 0, unopsTotal = 0;
        for (const v of viagensRender) {
          for (const it of v.items) {
            unopsTotal++;
            if (it.sheet_matched) unopsIn++;
          }
        }
        // Recomputa by_status sobre o subset
        const by_status = {};
        let total_kg = 0;
        for (const v of viagensRender) {
          by_status[v.status] = (by_status[v.status] || 0) + 1;
          total_kg += v.total_kg;
        }
        renderKpis({
          ...lastData.summary,
          viagens: viagensRender.length,
          by_status,
          total_kg: Math.round(total_kg),
          total_ton: Number((total_kg / 1000).toFixed(2)),
          total_items: viagensRender.reduce((s, v) => s + v.items.length, 0),
          unops_in: unopsIn,
          unops_total: unopsTotal,
        });
        renderViagens(viagensRender);
      }

      function setCacheInfo(cache) {
        const el = $("#cache-info");
        if (!cache) { el.textContent = ""; el.className = "cache-info"; return; }
        if (cache.from_cache) {
          const age = cache.age_seconds;
          const min = Math.floor(age / 60);
          const txt = min > 0 ? `Cache ${min}min` : `Cache ${age}s`;
          el.textContent = `· ${txt}`;
          el.className = "cache-info " + (age > 240 ? "stale" : "fresh");
        } else {
          el.textContent = "· Fresh";
          el.className = "cache-info fresh";
        }
      }

      async function load(forceFresh = false) {
        const f = pickFilters();
        const params = new URLSearchParams(f);
        if (forceFresh) params.set("noCache", "1");
        $("#viagens").innerHTML = `<div class="loading">${forceFresh ? "A buscar dados frescos (~30-60s)…" : "A carregar…"}</div>`;
        $("#kpis").innerHTML = "";
        $("#btn-export").disabled = true;
        $("#cache-info").textContent = "· a carregar…";
        $("#cache-info").className = "cache-info loading";
        const t0 = Date.now();
        try {
          const data = await fetchJSON("/api/admin/adicional/viagens?" + params);
          lastData = data;
          setCacheInfo(data.cache);
          populateProductFilter();
          rerender();
          $("#btn-export").disabled = false;
          const dt = ((Date.now() - t0) / 1000).toFixed(1);
          const src = data.cache?.from_cache ? "(cache)" : "(fresh)";
          if (toast) toast(`${fmt(data.viagens.length)} viagens (${fmt(data.summary.total_ton)} t) ${src} ${dt}s`, { kind: "ok" });
        } catch (e) {
          $("#viagens").innerHTML = `<div class="error">Erro: ${esc(e.message)}</div>`;
          $("#cache-info").textContent = "";
          if (toast) toast("Erro: " + e.message, { kind: "err" });
        }
      }

      $("#btn-load").addEventListener("click", () => load(false));
      $("#btn-force").addEventListener("click", () => load(true));
      $("#btn-clear").addEventListener("click", () => {
        ["status","province","district","supplier","batedor","unops","product"].forEach((k) => { $("#f-"+k).value = ""; });
        rerender();
      });

      // Filtros instant — selects mudam imediatamente
      ["status","unops","product"].forEach((k) => {
        $("#f-" + k).addEventListener("change", rerender);
      });

      // Filtros de texto — debounce para não re-renderizar a cada keystroke
      function debounce(fn, ms) {
        let t = null;
        return (...args) => {
          clearTimeout(t);
          t = setTimeout(() => fn(...args), ms);
        };
      }
      const debouncedRerender = debounce(rerender, 180);
      ["province","district","supplier","batedor"].forEach((k) => {
        $("#f-" + k).addEventListener("input", debouncedRerender);
      });

      $("#btn-expand-all").addEventListener("click", () => {
        const arts = $$("#viagens .viagem");
        const allOpen = arts.every((a) => a.classList.contains("open"));
        arts.forEach((a) => a.classList.toggle("open", !allOpen));
        $("#btn-expand-all").textContent = allOpen ? "Expandir tudo" : "Recolher tudo";
      });
      $("#btn-export").addEventListener("click", () => {
        const params = new URLSearchParams(pickFiltersForExport());
        window.location.href = "/api/admin/adicional/viagens/export.xlsx?" + params;
        if (toast) toast("A gerar Excel…", { kind: "ok" });
      });

      AdminUI.renderLayout("viagens");
      load();
    })();
  </script>
</body>
</html>
