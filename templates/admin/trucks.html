<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AQI Operacoes - Camioes</title>
  <link rel="stylesheet" href="/static/admin.css">
</head>
<body class="admin-body">
  <div id="layout"></div>
  <main class="admin-main">
    <header class="admin-header">
      <h1>Camioes</h1>
      <div style="display:flex;gap:.5rem">
        <button class="btn btn-success" id="btn-quick">⚡ Recepcao Rapida</button>
        <button class="btn btn-primary" id="btn-new">+ Registar Camiao</button>
      </div>
    </header>

    <section class="admin-filters">
      <select id="f-status">
        <option value="">Todos os estados</option>
        <option value="expected">Esperado</option>
        <option value="arrived">Chegou</option>
        <option value="unloading">A descarregar</option>
        <option value="unloaded">Descarregado</option>
        <option value="transferred">Transferido</option>
        <option value="cancelled">Cancelado</option>
      </select>
    </section>

    <section class="admin-section">
      <div class="tbl-wrap">
        <table class="adm-table">
          <thead><tr>
            <th>Matricula</th><th>Fornecedor</th><th>Motorista</th>
            <th>Estado</th><th>Carga</th><th>Anexos</th><th>Chegada</th><th></th>
          </tr></thead>
          <tbody id="trucks-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- Modal: Registar Camiao -->
  <div class="modal-overlay" id="modal" style="display:none">
    <div class="modal-card">
      <div class="modal-head">
        <h2>Novo Camiao</h2>
        <button class="modal-x" onclick="document.getElementById('modal').style.display='none'">&times;</button>
      </div>
      <form id="truck-form" class="modal-form">
        <label>Matricula *<input type="text" name="plate" required></label>
        <label>Motorista<input type="text" name="driver_name"></label>
        <label>Telefone do motorista<input type="text" name="driver_phone"></label>
        <label>Fornecedor
          <select name="supplier_id" id="sel-supplier"><option value="">— Seleccionar —</option></select>
        </label>
        <label>Estado
          <select name="status">
            <option value="expected">Esperado</option>
            <option value="arrived">Chegou</option>
            <option value="unloading">A descarregar</option>
          </select>
        </label>
        <label>Notas<textarea name="notes" rows="3"></textarea></label>
        <button type="submit" class="btn btn-primary">Criar</button>
      </form>
    </div>
  </div>

  <!-- Modal: Recepcao Rapida -->
  <div class="modal-overlay" id="quick-modal" style="display:none">
    <div class="modal-card" style="max-width:680px">
      <div class="modal-head">
        <h2>⚡ Recepcao Rapida</h2>
        <button class="modal-x" onclick="document.getElementById('quick-modal').style.display='none'">&times;</button>
      </div>
      <form id="quick-form" class="modal-form">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:.5rem">
          <label>Matricula *<input type="text" name="plate" required></label>
          <label>Motorista<input type="text" name="driver_name"></label>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:.5rem">
          <label>Telefone<input type="text" name="driver_phone"></label>
          <label>Fornecedor
            <select name="supplier_id" id="q-supplier"><option value="">—</option></select>
          </label>
        </div>
        <label>Armazem destino (opcional)
          <select name="warehouse_id" id="q-warehouse">
            <option value="">— Manter carga no camiao —</option>
          </select>
          <small style="color:#64748b;font-size:.7rem;display:block;margin-top:.2rem">
            Se nao seleccionar armazem, a carga fica retida no camiao para futura saida ou descarga.
          </small>
        </label>
        <label>Notas<textarea name="notes" rows="2"></textarea></label>

        <div style="border-top:1px solid #e2e8f0;padding-top:.75rem;margin-top:.5rem">
          <strong style="font-size:.78rem;color:#475569">Carga (multiplos produtos)</strong>
          <div id="q-items" style="margin-top:.5rem"></div>
          <button type="button" class="btn btn-sm" id="q-add">+ Adicionar produto</button>
        </div>

        <button type="submit" class="btn btn-success">Registar Recepcao</button>
        <div id="q-err" class="auth-error"></div>
      </form>
    </div>
  </div>

  <script src="/static/admin.js"></script>
  <script>
    AdminUI.renderLayout("trucks");

    async function loadTrucks() {
      const status = document.getElementById("f-status").value;
      const qs = status ? "?status=" + encodeURIComponent(status) : "";
      const trucks = await AdminUI.fetchJSON("/admin/api/trucks" + qs);
      document.getElementById("trucks-body").innerHTML = trucks.map((t) =>
        `<tr>
          <td><a href="/admin/trucks/${t.id}" class="link">${AdminUI.esc(t.plate)}</a></td>
          <td>${AdminUI.esc(t.supplier_name || "—")}</td>
          <td>${AdminUI.esc(t.driver_name || "—")}</td>
          <td>${AdminUI.statusBadge(t.status)}</td>
          <td style="text-align:center">${t.cargo_count}</td>
          <td style="text-align:center">${t.attachment_count}</td>
          <td>${AdminUI.fmtDate(t.arrived_at)}</td>
          <td><a href="/admin/trucks/${t.id}" class="btn btn-sm">Ver</a></td>
        </tr>`
      ).join("") || `<tr><td colspan="8" class="empty">Sem camioes registados</td></tr>`;
    }

    async function loadSuppliers() {
      const suppliers = await AdminUI.fetchJSON("/admin/api/suppliers");
      document.getElementById("sel-supplier").innerHTML = '<option value="">— Seleccionar —</option>' +
        suppliers.map((s) => `<option value="${s.id}">${AdminUI.esc(s.name)}</option>`).join("");
    }

    document.getElementById("f-status").addEventListener("change", loadTrucks);
    document.getElementById("btn-new").addEventListener("click", async () => {
      await loadSuppliers();
      document.getElementById("modal").style.display = "flex";
    });

    document.getElementById("truck-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const data = Object.fromEntries(fd);
      if (!data.supplier_id) data.supplier_id = null;
      await AdminUI.fetchJSON("/admin/api/trucks", { method: "POST", body: data });
      document.getElementById("modal").style.display = "none";
      e.target.reset();
      loadTrucks();
    });

    // ── Quick Receive ──────────────────────────────────────
    let qProducts = [], qWarehouses = [];
    function qItemRow() {
      return `<div class="q-item-row" style="display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:.4rem;margin-bottom:.4rem">
        <select name="product_id" required>
          <option value="">— Produto —</option>
          ${qProducts.map((p) => `<option value="${p.id}" data-unit="${p.default_unit}">${AdminUI.esc(p.name)}</option>`).join("")}
        </select>
        <input type="number" name="qty" step="0.01" placeholder="Qtd" required>
        <input type="text" name="unit" placeholder="kg" value="kg">
        <button type="button" class="btn btn-sm btn-danger" onclick="this.closest('.q-item-row').remove()">x</button>
      </div>`;
    }

    document.getElementById("btn-quick").addEventListener("click", async () => {
      AdminUI.clearCache();
      const [suppliers, products, warehouses] = await Promise.all([
        AdminUI.fetchJSON("/admin/api/suppliers"),
        AdminUI.loadProducts(),
        AdminUI.loadWarehouses(),
      ]);
      qProducts = products; qWarehouses = warehouses;
      document.getElementById("q-supplier").innerHTML = '<option value="">— Sem fornecedor —</option>' +
        suppliers.map((s) => `<option value="${s.id}">${AdminUI.esc(s.name)}</option>`).join("");
      document.getElementById("q-warehouse").innerHTML = '<option value="">— Seleccionar armazem —</option>' +
        warehouses.map((w) => `<option value="${w.id}">${AdminUI.esc(w.name)}</option>`).join("");
      document.getElementById("q-items").innerHTML = qItemRow();
      document.getElementById("q-err").textContent = "";
      document.getElementById("quick-modal").style.display = "flex";
    });

    document.getElementById("q-add").addEventListener("click", () => {
      document.getElementById("q-items").insertAdjacentHTML("beforeend", qItemRow());
    });

    document.getElementById("q-items").addEventListener("change", (e) => {
      if (e.target.name === "product_id") {
        const opt = e.target.selectedOptions[0];
        const unit = opt && opt.dataset.unit;
        if (unit) e.target.closest(".q-item-row").querySelector("[name='unit']").value = unit;
      }
    });

    document.getElementById("quick-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const items = [];
      document.querySelectorAll(".q-item-row").forEach((row) => {
        const product_id = row.querySelector("[name='product_id']").value;
        const qty = row.querySelector("[name='qty']").value;
        const unit = row.querySelector("[name='unit']").value;
        if (product_id && qty) items.push({ product_id: Number(product_id), qty: Number(qty), unit });
      });
      if (items.length === 0) {
        document.getElementById("q-err").textContent = "Adicionar pelo menos um produto";
        return;
      }
      const wh = fd.get("warehouse_id");
      const data = {
        plate: fd.get("plate"),
        driver_name: fd.get("driver_name"),
        driver_phone: fd.get("driver_phone"),
        supplier_id: fd.get("supplier_id") || null,
        warehouse_id: wh ? Number(wh) : null,
        notes: fd.get("notes"),
        items,
      };
      try {
        await AdminUI.fetchJSON("/admin/api/trucks/quick-receive", { method: "POST", body: data });
        document.getElementById("quick-modal").style.display = "none";
        e.target.reset();
        loadTrucks();
      } catch (err) {
        document.getElementById("q-err").textContent = err.message;
      }
    });

    loadTrucks();
  </script>
</body>
</html>
