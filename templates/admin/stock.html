<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AQI Operacoes - Stock</title>
  <link rel="stylesheet" href="/static/admin.css">
</head>
<body class="admin-body">
  <div id="layout"></div>
  <main class="admin-main">
    <header class="admin-header">
      <h1>Stock Total</h1>
      <div>
        <input type="text" id="f-product" placeholder="Filtrar por produto..." style="padding:.45rem .7rem;border:1.5px solid #e2e8f0;border-radius:8px;font-size:.82rem;min-width:240px">
      </div>
    </header>

    <section class="admin-section">
      <h2>Total por Produto (todos os locais)</h2>
      <div class="admin-cards" id="total-cards"></div>
    </section>

    <section class="admin-section">
      <h2>Stock por Armazem</h2>
      <div id="warehouses-list"></div>
    </section>

    <section class="admin-section">
      <h2>Carga em Camioes (nao descarregada)</h2>
      <div class="tbl-wrap">
        <table class="adm-table">
          <thead><tr><th>Camiao</th><th>Produto</th><th>Quantidade</th><th>Unidade</th></tr></thead>
          <tbody id="trucks-body"></tbody>
        </table>
      </div>
    </section>

    <section class="admin-section">
      <h2>Movimentos Recentes</h2>
      <div class="tbl-wrap">
        <table class="adm-table">
          <thead><tr><th>Data</th><th>Tipo</th><th>Produto</th><th>Qtd</th><th>Camiao</th><th>Armazem</th><th>Por</th></tr></thead>
          <tbody id="mov-body"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="/static/admin.js"></script>
  <script>
    AdminUI.renderLayout("stock");
    let stockData = null;
    function matches(product) {
      const q = (document.getElementById("f-product").value || "").trim().toLowerCase();
      if (!q) return true;
      return (product || "").toLowerCase().includes(q);
    }
    function render() {
      if (!stockData) return;
      const d = stockData;
      // Totals
      const totals = (d.totals || []).filter((s) => matches(s.product));
      document.getElementById("total-cards").innerHTML = totals.map((s) =>
        `<div class="adm-card adm-card-blue">
          <div class="adm-card-lbl">${AdminUI.esc(s.product)}</div>
          <div class="adm-card-val">${AdminUI.fmt(s.qty)}</div>
          <div class="adm-card-sub">${AdminUI.esc(s.unit)}</div>
        </div>`
      ).join("") || `<div class="empty">Sem stock disponivel</div>`;

      // By warehouse — group
      const byWh = {};
      (d.by_warehouse || []).filter((s) => matches(s.product)).forEach((s) => {
        const key = s.warehouse_id + "|" + (s.warehouse_name || "—");
        if (!byWh[key]) byWh[key] = { id: s.warehouse_id, name: s.warehouse_name, items: [] };
        byWh[key].items.push(s);
      });
      document.getElementById("warehouses-list").innerHTML = Object.values(byWh).map((w) => `
        <div style="margin-bottom:1rem">
          <h3 style="font-size:.85rem;color:#0f4c75;margin-bottom:.4rem">
            <a href="/admin/warehouses/${w.id}" class="link">${AdminUI.esc(w.name)}</a>
          </h3>
          <div class="admin-cards">
            ${w.items.map((s) =>
              `<div class="adm-card adm-card-green">
                <div class="adm-card-lbl">${AdminUI.esc(s.product)}</div>
                <div class="adm-card-val">${AdminUI.fmt(s.qty)}</div>
                <div class="adm-card-sub">${AdminUI.esc(s.unit)}</div>
              </div>`
            ).join("")}
          </div>
        </div>`
      ).join("") || `<div class="empty">Sem stock em armazens</div>`;

      // By truck
      const byTruck = (d.by_truck || []).filter((t) => matches(t.product));
      document.getElementById("trucks-body").innerHTML = byTruck.map((t) =>
        `<tr><td><a href="/admin/trucks/${t.truck_id}" class="link">${AdminUI.esc(t.plate)}</a></td>
         <td>${AdminUI.esc(t.product)}</td>
         <td>${AdminUI.fmt(t.qty)}</td>
         <td>${AdminUI.esc(t.unit)}</td></tr>`
      ).join("") || `<tr><td colspan="4" class="empty">Sem carga em transito</td></tr>`;

      // Movements
      const movs = (d.movements || []).filter((m) => matches(m.product));
      document.getElementById("mov-body").innerHTML = movs.map((m) =>
        `<tr><td>${AdminUI.fmtDate(m.created_at)}</td>
         <td><span class="badge">${m.type}</span></td>
         <td>${AdminUI.esc(m.product)}</td>
         <td>${AdminUI.fmt(m.qty)}</td>
         <td>${AdminUI.esc(m.plate || "—")}</td>
         <td>${AdminUI.esc(m.warehouse_name || "—")}</td>
         <td>${AdminUI.esc(m.user_name || "")}</td></tr>`
      ).join("") || `<tr><td colspan="7" class="empty">Sem movimentos</td></tr>`;
    }

    AdminUI.fetchJSON("/admin/api/stock-v2").then((d) => {
      stockData = d;
      render();
    });
    document.getElementById("f-product").addEventListener("input", render);
  </script>
</body>
</html>
