<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AQI Operacoes - Stock Virtual</title>
  <link rel="stylesheet" href="/static/admin.css">
</head>
<body class="admin-body">
  <div id="layout"></div>
  <main class="admin-main">
    <header class="admin-header">
      <h1>Stock Virtual</h1>
      <span class="admin-sub">Calculado a partir das cargas dos camioes recebidos</span>
    </header>
    <section class="admin-section">
      <h2>Stock por Produto</h2>
      <div class="admin-cards" id="stock-cards"></div>
    </section>
    <section class="admin-section">
      <h2>Movimentos</h2>
      <div class="tbl-wrap">
        <table class="adm-table">
          <thead><tr><th>Data</th><th>Tipo</th><th>Produto</th><th>Qtd</th><th>Camiao</th><th>Notas</th><th>Por</th></tr></thead>
          <tbody id="mov-body"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="/static/admin.js"></script>
  <script>
    AdminUI.renderLayout("stock");
    AdminUI.fetchJSON("/admin/api/stock").then((d) => {
      document.getElementById("stock-cards").innerHTML = (d.virtual || []).map((s) =>
        `<div class="adm-card adm-card-blue">
          <div class="adm-card-lbl">${AdminUI.esc(s.product)}</div>
          <div class="adm-card-val">${AdminUI.fmt(s.qty)}</div>
          <div class="adm-card-sub">${AdminUI.esc(s.unit)}</div>
        </div>`
      ).join("") || `<div class="empty">Sem stock virtual disponivel</div>`;

      document.getElementById("mov-body").innerHTML = (d.movements || []).map((m) =>
        `<tr><td>${AdminUI.fmtDate(m.created_at)}</td>
         <td><span class="badge">${m.type}</span></td>
         <td>${AdminUI.esc(m.product)}</td>
         <td>${AdminUI.fmt(m.qty)}</td>
         <td>${AdminUI.esc(m.plate || "—")}</td>
         <td>${AdminUI.esc(m.notes || "")}</td>
         <td>${AdminUI.esc(m.user_name || "")}</td></tr>`
      ).join("") || `<tr><td colspan="7" class="empty">Sem movimentos</td></tr>`;
    });
  </script>
</body>
</html>
