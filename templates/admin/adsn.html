<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AQI Operacoes - ADSNs</title>
<link rel="stylesheet" href="/static/admin.css">
</head>
<body class="admin-body">
<div id="layout"></div>
<main class="admin-main">
  <header class="admin-header">
    <h1>Serviços ADSN (Códigos de Saída)</h1>
    <label class="btn btn-primary" style="cursor:pointer">
      📥 Importar Excel (servicos)
      <input type="file" id="import-file" accept=".xlsx,.xls" style="display:none">
    </label>
  </header>

  <section class="admin-section">
    <div id="counts" style="display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem;margin-bottom:1rem"></div>

    <div style="display:flex;gap:.75rem;margin-bottom:1rem;flex-wrap:wrap">
      <input type="text" id="f-q" placeholder="Pesquisar ADSN, GTU, destinatário..." style="flex:1;min-width:200px;padding:.5rem .75rem;border:1px solid #cbd5e1;border-radius:6px">
      <select id="f-status" style="padding:.5rem;border:1px solid #cbd5e1;border-radius:6px">
        <option value="">Todos</option>
        <option value="pending">Pendente</option>
        <option value="dispatched">Despachado</option>
        <option value="cancelled">Cancelado</option>
      </select>
    </div>

    <div class="tbl-wrap">
      <table class="adm-table">
        <thead><tr>
          <th>ADSN</th><th>GTU</th><th>Destinatário</th>
          <th>Província</th><th>Distrito</th><th>Produto</th>
          <th style="text-align:right">Peso</th><th>Estado</th>
        </tr></thead>
        <tbody id="body"></tbody>
      </table>
    </div>
  </section>
</main>

<script src="/static/admin.js"></script>
<script>
AdminUI.renderLayout("adsn");

async function load() {
  const q = document.getElementById("f-q").value.trim();
  const status = document.getElementById("f-status").value;
  const params = new URLSearchParams();
  if (q) params.set("q", q);
  if (status) params.set("status", status);
  const data = await AdminUI.fetchJSON("/admin/api/adsn?" + params);

  document.getElementById("counts").innerHTML = `
    <div class="metric-card"><div class="metric-label">Pendentes</div><div class="metric-value" style="color:#d97706">${data.counts.pending || 0}</div></div>
    <div class="metric-card"><div class="metric-label">Despachados</div><div class="metric-value" style="color:#16a34a">${data.counts.dispatched || 0}</div></div>
    <div class="metric-card"><div class="metric-label">Cancelados</div><div class="metric-value" style="color:#64748b">${data.counts.cancelled || 0}</div></div>
  `;

  const body = document.getElementById("body");
  if (!data.list.length) { body.innerHTML = '<tr><td colspan="8" class="empty">Sem ADSNs. Importe um Excel para começar.</td></tr>'; return; }
  body.innerHTML = data.list.map((a) =>
    `<tr>
      <td><code>${AdminUI.esc(a.adsn_code)}</code></td>
      <td><code>${AdminUI.esc(a.gtu || "—")}</code></td>
      <td>${AdminUI.esc(a.destinatario || "—")}</td>
      <td>${AdminUI.esc(a.provincia || "—")}</td>
      <td>${AdminUI.esc(a.distrito || "—")}</td>
      <td>${AdminUI.esc(a.product_name || a.sku || "—")}</td>
      <td style="text-align:right">${AdminUI.fmt(a.peso_kg)}</td>
      <td>${AdminUI.statusBadge(a.status)}</td>
    </tr>`
  ).join("");
}

document.getElementById("f-q").addEventListener("input", () => {
  clearTimeout(window._t); window._t = setTimeout(load, 250);
});
document.getElementById("f-status").addEventListener("change", load);

document.getElementById("import-file").addEventListener("change", async (e) => {
  if (!e.target.files.length) return;
  const fd = new FormData(); fd.append("file", e.target.files[0]);
  try {
    const r = await fetch("/admin/api/adsn/import", { method: "POST", body: fd });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || "Erro ao importar");
    alert(`✓ ${j.inserted} novos, ${j.duplicates} duplicados, ${j.skipped} ignorados (${j.total} linhas)`);
    e.target.value = "";
    load();
  } catch (err) { alert("Erro: " + err.message); }
});

load();
</script>
</body>
</html>
