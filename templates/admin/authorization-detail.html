<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AQI Operacoes - Autorização</title>
<link rel="stylesheet" href="/static/admin.css">
</head>
<body class="admin-body">
<div id="layout"></div>
<main class="admin-main">
  <header class="admin-header">
    <h1 id="title">Autorização</h1>
    <div style="display:flex;gap:.5rem">
      <a href="/admin/authorizations" class="btn">← Voltar</a>
      <a id="btn-print" class="btn btn-primary" target="_blank">🖨️ Imprimir / PDF</a>
      <button id="btn-entry" class="btn btn-primary">📥 Registar Entrada</button>
    </div>
  </header>

  <section class="admin-section">
    <div id="info" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.75rem;margin-bottom:1.25rem"></div>

    <h3 style="margin:1rem 0 .75rem">Itens</h3>
    <div class="tbl-wrap">
      <table class="adm-table">
        <thead><tr><th>Produto</th><th style="text-align:right">Qtd a levantar</th><th>Unidade</th></tr></thead>
        <tbody id="items-body"></tbody>
      </table>
    </div>

    <h3 style="margin:1.5rem 0 .75rem">Entradas registadas</h3>
    <div class="tbl-wrap">
      <table class="adm-table">
        <thead><tr><th>Nº Entrada</th><th>Data</th><th style="text-align:right">Qtd</th><th></th></tr></thead>
        <tbody id="entries-body"></tbody>
      </table>
    </div>
  </section>
</main>

<script src="/static/admin.js"></script>
<script>
AdminUI.renderLayout("authorizations");
const authId = location.pathname.split("/").pop();
document.getElementById("btn-print").href = "/admin/authorizations/" + authId + "/print";

async function load() {
  const a = await AdminUI.fetchJSON("/admin/api/authorizations/" + authId);
  document.getElementById("title").textContent = "Autorização " + a.auth_number;
  const info = document.getElementById("info");
  info.innerHTML = `
    <div class="info-card"><div class="info-label">Nº</div><div class="info-value">${AdminUI.esc(a.auth_number)}</div></div>
    <div class="info-card"><div class="info-label">PO</div><div class="info-value"><a href="/admin/purchase-orders/${a.po_id}">${AdminUI.esc(a.po_number || "—")}</a></div></div>
    <div class="info-card"><div class="info-label">Fornecedor</div><div class="info-value">${AdminUI.esc(a.supplier_name || "—")}</div></div>
    <div class="info-card"><div class="info-label">NUIT</div><div class="info-value">${AdminUI.esc(a.supplier_nuit || "—")}</div></div>
    <div class="info-card"><div class="info-label">Matrícula</div><div class="info-value"><strong>${AdminUI.esc(a.truck_plate)}</strong></div></div>
    <div class="info-card"><div class="info-label">Motorista</div><div class="info-value">${AdminUI.esc(a.driver_name)}</div></div>
    <div class="info-card"><div class="info-label">Contacto</div><div class="info-value">${AdminUI.esc(a.driver_phone || "—")}</div></div>
    <div class="info-card"><div class="info-label">Transportador</div><div class="info-value">${AdminUI.esc(a.transporter_name || "—")}</div></div>
    <div class="info-card"><div class="info-label">Emitida em</div><div class="info-value">${AdminUI.fmtDate(a.issued_at)}</div></div>
    <div class="info-card"><div class="info-label">Estado</div><div class="info-value">${AdminUI.statusBadge(a.status)}</div></div>
  `;

  document.getElementById("items-body").innerHTML = a.items.map((it) =>
    `<tr><td>${AdminUI.esc(it.product_name)}</td><td style="text-align:right"><strong>${AdminUI.fmt(it.qty_to_pickup)}</strong></td><td>${AdminUI.esc(it.unit)}</td></tr>`
  ).join("");

  const entries = await AdminUI.fetchJSON("/admin/api/entries?auth_id=" + authId);
  document.getElementById("entries-body").innerHTML = entries.map((e) =>
    `<tr>
      <td><a href="/admin/entries/${e.id}"><strong>${AdminUI.esc(e.entry_number)}</strong></a></td>
      <td>${AdminUI.fmtDate(e.received_at)}</td>
      <td style="text-align:right">${AdminUI.fmt(e.total_qty)}</td>
      <td><a class="btn btn-sm" href="/admin/entries/${e.id}">Ver</a></td>
    </tr>`
  ).join("") || '<tr><td colspan="4" class="empty">Ainda sem entradas</td></tr>';
}

document.getElementById("btn-entry").addEventListener("click", () => {
  location.href = "/admin/entries?new_from=" + authId;
});

load();
</script>
</body>
</html>
